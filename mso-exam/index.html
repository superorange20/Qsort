<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MSO 能力评核模拟试卷</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #2a2f3a;
      --accent: #4c8bf5;
      --ok: #3dd68c;
      --bad: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang HK", "Noto Sans TC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 80px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
    .bar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15,17,21,.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 10px 0 12px;
      margin: 0 -14px 14px;
      padding-left: 14px; padding-right: 14px;
    }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .stat {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px;
    }
    .stat b { display: block; font-size: 1.05rem; }
    .stat span { color: var(--muted); font-size: 0.75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button, .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .chip.on { border-color: var(--accent); color: var(--accent); }
    .note {
      border: 1px solid var(--line);
      background: #151922;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }
    .note.ok { border-color: #2a5a40; }
    .note.warn { border-color: #5a4a20; }
    .mod-title { margin: 22px 0 10px; font-size: 1.05rem; }
    .q {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .q-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
    .pill {
      flex: 0 0 auto;
      font-size: 0.75rem;
      border-radius: 999px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .pill.saved { color: var(--accent); border-color: #35598f; }
    .pill.ok { color: var(--ok); border-color: #2a5a40; }
    .pill.bad { color: var(--bad); border-color: #5a3038; }
    .items { color: var(--muted); font-size: 0.92rem; margin: 8px 0 10px; }
    .choice {
      display: block; width: 100%; text-align: left;
      margin: 6px 0; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--line);
      background: #12151c; color: var(--text);
    }
    .choice.active { border-color: var(--accent); background: #182235; }
    .choice.correct { border-color: var(--ok); background: #14241c; }
    .choice.wrong { border-color: var(--bad); }
    .tip { margin-top: 8px; color: var(--muted); font-size: 0.86rem; }
    .toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: #22304a; color: #fff; padding: 8px 14px; border-radius: 999px;
      font-size: 0.85rem; opacity: 0; pointer-events: none; transition: .2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
    .cloud-panel { border: 1px solid var(--line); background: #151922; border-radius: 12px; padding: 10px; margin: 8px 0 12px; }
    .cloud-panel input { width: 100%; margin: 5px 0; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0f1115; color: var(--text); }
    .cloud-status { color: var(--muted); font-size: .82rem; margin: 5px 0; }
    .cloud-status.ok { color: var(--ok); } .cloud-status.error { color: var(--bad); } .cloud-status.warn { color: #e5bd63; }
    .history-row { display:flex; justify-content:space-between; gap:10px; border-top:1px solid var(--line); padding:7px 0; font-size:.82rem; }
    .history-row small { display:block; color:var(--muted); } .passed { color:var(--ok); white-space:nowrap; } .failed { color:var(--bad); white-space:nowrap; }
    .muted { color: var(--muted); }
    .wrongbook-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
    .wrongbook-meta { color:var(--muted); font-size:.8rem; margin-bottom:8px; }
    .wrongbook-answer { margin-top:9px; color:var(--ok); font-size:.88rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <h1 id="title">MSO 能力评核模拟试卷</h1>
      <div class="sub" id="subtitle">35题 · 7单元 · 官方组合题型 · 进度自动保存在本机浏览器</div>
      <section class="cloud-panel" aria-label="云端账号与同步">
        <b>云端账号 / 跨设备同步</b>
        <div id="cloudStatus" class="cloud-status">正在检查云端配置…</div>
        <div id="cloudAuthForm">
          <input id="cloudEmail" type="email" autocomplete="email" placeholder="邮箱地址" />
          <input id="cloudPassword" type="password" autocomplete="current-password" placeholder="密码（至少8位）" />
          <div class="actions"><button class="primary" id="cloudLogin" type="button">登录</button><button id="cloudSignup" type="button">注册新账号</button></div>
        </div>
        <div id="cloudSignedIn" hidden>
          <div class="actions" style="align-items:center"><span id="cloudUser"></span><button id="cloudLogout" type="button">退出登录</button><button id="cloudRefreshHistory" type="button">刷新历史</button></div>
          <div id="cloudHistory" style="margin-top:8px"></div>
        </div>
      </section>
      <div class="actions" id="paperTabs" style="margin-bottom:10px"></div>
      <div class="stats">
        <div class="stat"><b id="sAnswered">0/35</b><span>已作答</span></div>
        <div class="stat"><b id="sScore">—</b><span>总分</span></div>
        <div class="stat"><b id="sModules">—</b><span>单元门槛</span></div>
        <div class="stat"><b id="sResult">作答中</b><span>总评</span></div>
      </div>
      <div class="actions" id="filters"></div>
      <div class="actions" style="margin-top:8px">
        <button class="primary" id="btnSubmit" disabled>交卷并计分</button>
        <button id="btnTips" hidden>显示解析</button>
        <button id="btnWrongBook" type="button">错题本</button>
        <button id="btnWrong" hidden>只看错题</button>
        <button id="btnContinue">只看未答题</button>
        <button id="btnReset">清空重做…</button>
      </div>
    </div>

    <div class="note ok" id="saveNote">进度会自动保存到本机浏览器。关掉页面再打开，可继续做。</div>
    <div class="note warn" id="resultBox" hidden></div>
    <div id="paper"></div>
  </div>
  <div class="toast" id="toast">已保存</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./cloud-sync.js"></script>
  <script src="./papers-9-10.js"></script>
  <script>
    const STD = ["a) 1、2及3", "b) 1、2及4", "c) 2、3及4", "d) 1、3及4", "e) 以上皆是"];
    const STAGES = ["a) 1、2及3", "b) 2、3及4", "c) 1、3及4", "d) 1、2及5", "e) 3、4及5"];
    const KEYS = ["A", "B", "C", "D", "E"];
    const LONG_STD = ["A) 1、2及3", "B) 1、3及4", "C) 2、3及4", "D) 1、2及4", "E) 以上皆是"];
    const MODULES = [
      "单元一　打击洗钱及恐怖分子资金筹集与打击扩散资金筹集的常识",
      "单元二　《打击洗钱条例》第1至7部",
      "单元三　《打击洗钱条例》的附表",
      "单元四　海关颁布的指引",
      "单元五　系统及管控措施(i)　机构层面的管治及策略",
      "单元六　系统及管控措施(ii)　打击洗钱及恐怖分子资金筹集的管控范畴",
      "单元七　系统及管控措施(iii)　证明符合规定及监察合规水平",
    ];

    // Paper 1: original set
    const PAPER1 = [
      {id:1,module:1,stem:"何谓洗钱的3个常见阶段？",items:["分层交易","识别","整合","存放","筹集"],answer:2,variant:"stages",tip:"存放→分层→整合。识别、筹集不是三阶段。"},
      {id:2,module:1,stem:"关于恐怖分子资金筹集，下列哪项正确？",items:["用以资助恐怖活动的资金可以来自合法来源","资金来源必然全属犯罪得益","重点在于资金被用于资助恐怖活动或恐怖分子","只有跨境汇款才可能涉及该风险"],answer:1,tip:"1与3正确；可用合法资金，不限跨境。"},
      {id:3,module:1,stem:"关于扩散资金筹集，下列哪项正确？",items:["关乎大规模毁灭武器相关扩散活动筹集资金","MSO亦须关注金融制裁及名单筛查","仅适用于银行，MSO可豁免","相关风险可纳入整体制裁／名单管控"],answer:1,tip:"1、2、4正确；MSO不能豁免。"},
      {id:4,module:1,stem:"下列哪些属于常见洗钱／恐怖融资红旗？",items:["客户拒绝或不愿提供合理身分证明","交易模式与客户背景明显不符","客户要求拆分交易以规避尽职审查门槛","客户主动提供清晰资金来源说明并配合核验"],answer:1,tip:"1–3是红旗；4不是。"},
      {id:5,module:1,stem:"关于「以风险为本」方法，下列哪项正确？",items:["按已识别风险高低分配管控资源","对所有客户一律执行完全相同、不可调整的措施","高风险情况应采取加强措施","低风险情况在符合规定下可采取简化措施"],answer:1,tip:"1、3、4正确；不是一刀切。"},
      {id:6,module:2,stem:"关于金钱服务经营者发牌制度，下列哪项正确？",items:["香港海关是规管金钱服务经营者的有关当局","任何人须在经营金钱服务前向关长申请牌照","无牌经营属刑事罪行","即使申请被拒，已缴费用一般仍可获退还"],answer:0,tip:"费用不论结果概不退还。"},
      {id:7,module:2,stem:"有关金钱服务经营者持牌人经营金钱服务的情况，下列哪项正确？",items:["持牌人可自由选择是否在指明处所展示牌照","如处所属住宅处所，须取得每名占用人书面同意","与牌照申请有关的详情改变，须在一个月内书面具报","持牌人如拟停止经营金钱服务，须在停业日期前书面具报"],answer:1,tip:"2、3、4正确；须展示牌照。"},
      {id:8,module:2,stem:"关长在批给牌照前，须信纳下列哪些人属适当人选？",items:["申请人属个人：该个人及每名最终拥有人","申请人属合伙：每名合伙人及每名最终拥有人","申请人属法团：每名董事及每名最终拥有人","仅洗钱报告主任须属适当人选，董事无须"],answer:0,tip:"1–3正确。"},
      {id:9,module:2,stem:"关于金钱服务经营者牌照有效期及续期，下列哪项正确？",items:["正常来说，所批给牌照的有效期为两年","持牌人须在牌照期满前45日或之前申请续期","海关一般会在期满前约90日发出提示通知","续期申请被拒后，已缴费用通常可自动退还"],answer:1,tip:"1–3正确；费用不退。"},
      {id:10,module:2,stem:"关于持牌人停业安排，下列哪项正确？",items:["须在停业日期前藉书面向关长具报意向及停业日期","须在自停业日期起计7日内将牌照交回关长","口头通知海关后即可继续以牌照名义招揽客户至届满","无合理辩解而违反停业具报规定可构成罪行"],answer:1,tip:"1、2、4正确。"},
      {id:11,module:3,stem:"关于金钱服务经营者持牌人的法定客户尽职审查规定，下列哪项正确？",items:["识别客户身分，及根据可靠及独立来源核实","不得开立或维持匿名户口","须持续监察交易是否符合对客户的认知","进行相等于$8,000或以上汇款交易前，须核实汇款人身分"],answer:1,tip:"以上皆是。"},
      {id:12,module:3,stem:"金钱服务经营者须在下列哪些情况就客户执行尽职审查措施？",items:["在与客户建立业务关系之前","为客户执行总值相等于$120,000或以上的非经常交易之前","为客户执行相等于$8,000或以上的电传转帐／汇款之前","怀疑涉及洗钱／恐怖融资时（不论是否达门槛）"],answer:1,tip:"以上皆是。"},
      {id:13,module:3,stem:"关于备存纪录的法定规定，下列哪项正确？",items:["交易纪录一般须自交易完成日起计备存6年","客户身分纪录须在业务关系存续期间备存，并自关系终止日起计备存6年","关长可以书面通知要求备存更长期间的指定纪录","交易完成后满1年即可销毁全部客户身分核证文件"],answer:0,tip:"1–3正确。"},
      {id:14,module:3,stem:"就属法人的客户执行尽职审查时，一般须收集下列哪项识别资料？",items:["注册、成立或登记的日期","注册、成立或登记的地点","公司秘书（作为必然必收的识别资料）","主要营业地点"],answer:1,tip:"1、2、4正确；公司秘书非必然必收。"},
      {id:15,module:3,stem:"关于法团的「最终拥有人」，下列哪项正确？",items:["直接或间接拥有或控制该法团已发行股本的25%以上的个人","直接或间接有权行使该法团成员大会上投票权的25%以上的个人","可行使对该法团管理最终控制权的个人","仅指持股超过75%的单一股东"],answer:0,tip:"1–3正确。"},
      {id:16,module:4,stem:"金钱服务经营者进行机构层面的洗钱／恐怖分子资金筹集风险评估时，应顾及下列哪类因素？",items:["目标市场及客户类别","业务盈利能力","业务性质、规模、多元程度及复杂程度","交付渠道"],answer:3,tip:"1、3、4正确；盈利能力不是必要因素。"},
      {id:17,module:4,stem:"关于金钱服务经营者持牌人的本地管理办事处规定，下列哪项正确？",items:["无论持牌人会或不会在特定处所经营，都一律必须另设本地管理办事处","本地管理办事处须驻有合规主任、独资经营者、合伙人、董事或最终拥有人","本地管理办事处可让海关人员亲身前往及以电话联络","如未能维持本地管理办事处，将可能导致暂时吊销及撤销牌照"],answer:2,tip:"2、3、4正确；无特定处所经营时才必须维持LMO。"},
      {id:18,module:4,stem:"为履行法定的可疑交易举报责任，适当的制度须包括：",items:["委任一名洗钱报告主任","向洗钱报告主任报告前，先由前线人员筛选内部报告","就内部报告、向财富情报组作出报告及防止通风报讯执行清晰政策程序","备存内部报告及可疑交易报告的妥善纪录"],answer:3,tip:"1、3、4正确；前线不可先筛选。"},
      {id:19,module:4,stem:"关于合规主任及洗钱报告主任，下列哪项正确？",items:["合规主任作为监督AML制度及合规措施的中心点","洗钱报告主任作为报告可疑交易的中央联络点","除非由独资经营者、合伙人、董事或最终拥有人兼任，否则须为正式雇员","可由秘书公司职员完全外判担任，而无须属申请人雇员"],answer:0,tip:"1–3正确。"},
      {id:20,module:4,stem:"关于用作经营金钱服务的特定处所，下列哪项正确？",items:["纯住宅楼宇内的处所一般被视为不适合登记","位于混合式商住楼宇内的处所，须取得每名占用人书面同意","特定处所招牌所展示的业务名称应与商业登记证相符","即使另一名金钱服务经营者已占用该处所经营，新申请人仍可同时登记同一处所"],answer:0,tip:"1–3正确。"},
      {id:21,module:5,stem:"关于金钱服务经营者高级管理层的责任，下列哪项正确？",items:["应核准机构的AML风险取向及相关政策","应确保配备足够资源以落实有效管控","把全部合规责任转嫁予前线员工后，高级管理层即可完全免责","应定期检视制度是否足够及有效"],answer:1,tip:"1、2、4正确。"},
      {id:22,module:5,stem:"关于能力评核安排，下列哪项正确？",items:["高级管理层中必须有最少一名成员取得合格成绩","能力评核成绩在评定适当人选资格时占相当比重","同属一间公司的应考者必须应考同一时段","任何前线柜员均可不经提名自行应考并作为公司合格资格"],answer:0,tip:"1–3正确。"},
      {id:23,module:5,stem:"关于能力评核的合格标准及模式，下列哪项正确？",items:["试卷共有35条选择题，须于1小时15分钟内完成","分为7个单元，每个单元有5题","每个单元不可答错超过两题，且总分须达25分或以上","只要总分达25分，即使某一单元全错仍属合格"],answer:0,tip:"1–3正确；双门槛须同时满足。"},
      {id:24,module:5,stem:"金钱服务经营者的AML制度，在机构管治层面通常应包括：",items:["经高级管理层核准的政策、程序及管控措施","委任合规主任及洗钱报告主任","与业务风险相称的独立检测／审核安排","完全依赖员工个人常识而无须备存成文政策"],answer:0,tip:"1–3正确。"},
      {id:25,module:5,stem:"关于新牌照申请的能力评核时限，下列哪项正确？",items:["合资格人士须在与海关人员会面当日起计30日内应考","如不及格，可获另一次机会于成绩通知发出当日起计30日后再次应考","未应考或未合格可能导致牌照申请被拒绝","可在获发牌照多年后才首次安排应考"],answer:0,tip:"1–3正确。"},
      {id:26,module:6,stem:"客户尽职审查措施一般包括下列哪些？",items:["识别客户的身分，并采取合理措施核证客户的身分","识别实益拥有人的身分，并采取合理措施核证","如属业务关系，取得有关业务关系的目的及拟具有的性质的资料","对为客户执行的交易进行持续监察"],answer:4,tip:"以上皆是。"},

      {id:30,module:6,stem:"关于名单筛查及金融制裁管控，下列哪项正确？",items:["应设有程序对照适用的制裁／恐怖分子等名单进行筛查","筛查纪录应妥善备存","出现命中或可疑命中时，应有升级处理及跟进程序","只需在开业当日筛查一次，其后永不再更新名单或重做筛查"],answer:0,tip:"1–3正确。"},

      {id:26,module:6,stem:"客户尽职审查措施通常包括：",items:["识别及核证客户身分","识别实益拥有人并采取合理措施核证","取得业务关系目的及拟具性质的资料（如适用）","对交易进行与风险相称的持续监察"],answer:4,tip:"以上皆是。"},
      {id:27,module:6,stem:"更严格尽职审查，下列哪项正确？",items:["高风险客户应考虑EDD","涉及政治人物等高风险情况应考虑EDD","涉及高风险司法管辖区应考虑EDD","所有本地低风险零售兑换客户一律强制EDD"],answer:0,tip:"低风险不是一律强制EDD。"},
      {id:28,module:6,stem:"备存客户尽职审查及交易资料，下列哪项正确？",items:["应备存实益拥有人身分证明文件","应备存任何已作分析的结果","应备存客户住址及开户／交易相关纪录","只需保留交易金额数字，其他可即时销毁"],answer:0,tip:"1–3正确；住址等亦须备存。"},
      {id:29,module:6,stem:"可疑交易报告，下列哪项正确？",items:["员工应按程序向MLRO内部报告","MLRO应考虑是否向财富情报组举报","须防止向客户通风报讯","为免得罪客户，应先告知客户已作出可疑交易报告"],answer:0,tip:"告知客户属通风报讯，禁止。"},
      {id:30,module:6,stem:"名单筛查，下列哪项正确？",items:["应对客户及相关方对照适用名单筛查","筛查纪录应备存","命中或可疑命中应有升级处理程序","开业当日筛查一次后，名单永不必更新"],answer:0,tip:"筛查须持续／按触发更新。"},

      {id:31,module:7,stem:"定期申报责任，下列哪项正确？",items:["除另有指定外，须在每半年开始后两星期内递交","逾期可导致牌照被暂时吊销及／或撤销","须以关长指明格式及方式递交","只需在申请续牌时才首次考虑是否递交"],answer:0,tip:"申报是持续责任。"},
      {id:32,module:7,stem:"下列哪些可导致撤销或暂时吊销牌照？",items:["有关人士不再属适当人选","未能维持本地纪录存放地点或LMO（如适用）","未能委任或维持合资格CO／MLRO","未能按时报交定期申报表"],answer:4,tip:"以上皆是。"},
      {id:33,module:7,stem:"独立检测／审核，下列哪项正确？",items:["目的是评估AML制度是否足够及有效运作","应向高级管理层汇报缺失及跟进","检测范围应与机构风险及业务性质相称","可完全取代合规主任的日常监督职能"],answer:0,tip:"检测不能取代CO。"},
      {id:34,module:7,stem:"为证明符合AML规定，宜备存：",items:["机构及客户层面的风险评估纪录","政策程序、培训、筛查及可疑交易相关档案","独立检测报告及整改跟进纪录","仅备存宣传单张及营业额统计即可充分证明合规"],answer:0,tip:"宣传材料不足以证明合规。"},
      {id:35,module:7,stem:"能力评核成绩通知，下列哪项正确？",items:["一般在考试结束后14日内以电邮通知合格或不合格","可在发出成绩通知当日起计7日内书面要求覆检","海关不会披露实际分数、试题及相关正确答案","能力评核合格即等同已符合全部发牌规定并保证获批牌照"],answer:0,tip:"合格不等于必然获牌。"},
    ];

    // Paper 5: aligned to official 參考試題 style (see mso-exam/reference/10-參考試題.pdf)
    const PAPER5 = [
      {id:1,module:1,stem:"关于洗钱的常见阶段，下列哪项正确？",items:["常见三阶段为存放、分层及整合","存放通常指将非法得益引入金融系统","分层是透过多层交易掩饰资金来源","识别客户身分本身属洗钱三阶段之一"],answer:0,tip:"1–3正确；「识别」不是洗钱三阶段。"},
      {id:2,module:1,stem:"关于恐怖分子资金筹集，下列哪项正确？",items:["用以资助恐怖活动的资金可以来自合法来源","重点在于资金被用于资助恐怖活动或恐怖分子","金额低于$8,000即必然不构成恐怖融资风险","名单筛查有助减低相关风险"],answer:1,tip:"1、2、4正确；低金额不代表无风险。"},
      {id:3,module:1,stem:"关于扩散资金筹集及金融制裁，下列哪项正确？",items:["扩散资金筹集关乎大规模毁灭武器相关活动","金钱服务经营者亦须关注制裁及名单筛查","命中或可疑命中后应升级处理并备存纪录","相关风险可纳入整体制裁／名单管控"],answer:4,tip:"以上皆是。"},
      {id:4,module:1,stem:"下列哪些较可能属洗钱／恐怖融资红旗？",items:["客户拒绝或不愿提供合理身分证明","交易模式与客户背景明显不符","客户要求拆分交易以规避尽职审查门槛","客户主动提供清晰资金来源说明并配合核验"],answer:0,tip:"1–3是红旗；4属正常配合。"},
      {id:5,module:1,stem:"关于「以风险为本」方法，下列哪项正确？",items:["应按已识别风险高低分配管控资源","高风险情况应采取加强措施","低风险情况在符合规定下可采取简化措施","对所有客户一律执行完全相同、不可调整的措施"],answer:0,tip:"1–3正确；不是一刀切。"},

      {id:6,module:2,stem:"关于金钱服务经营者发牌制度，下列哪项正确？",items:["香港海关是规管金钱服务经营者的有关当局","任何人须在经营金钱服务前向关长申请牌照","无牌经营属刑事罪行","即使申请被拒，已缴费用一般仍可获退还"],answer:0,tip:"费用不论结果概不退还。《打击洗钱条例》第5部。"},
      {id:7,module:2,stem:"有关金钱服务经营者持牌人经营金钱服务的情况，下列哪项正确？",items:["持牌人可自由选择是否在指明处所展示牌照","如处所属住宅处所，须取得每名占用人书面同意","与牌照申请有关的详情改变，须在一个月内书面具报","持牌人如拟停止经营金钱服务，须在停业日期前书面具报"],answer:2,tip:"2、3、4正确；须展示牌照。《打击洗钱条例》第5部。"},
      {id:8,module:2,stem:"关长在批给牌照前，须信纳下列哪些人属适当人选？",items:["申请人属个人：该个人及每名最终拥有人","申请人属合伙：每名合伙人及每名最终拥有人","申请人属法团：每名董事及每名最终拥有人","仅洗钱报告主任须属适当人选，董事无须"],answer:0,tip:"1–3正确。"},
      {id:9,module:2,stem:"关于金钱服务经营者牌照有效期及续期，下列哪项正确？",items:["正常来说，所批给牌照的有效期为两年","持牌人须在牌照期满前45日或之前申请续期","海关一般会在期满前约90日发出提示通知","提示发出后，即使不递交续期申请也会自动续牌"],answer:0,tip:"1–3正确；不会自动续牌。"},
      {id:10,module:2,stem:"关于持牌人停业安排，下列哪项正确？",items:["须在停业日期前藉书面向关长具报意向及停业日期","须在自停业日期起计7日内将牌照交回关长","无合理辩解而违反停业具报规定可构成罪行","口头通知海关后即可继续以牌照名义招揽客户至届满"],answer:0,tip:"1–3正确；口头通知不足。"},

      {id:11,module:3,stem:"关于金钱服务经营者持牌人的法定客户尽职审查规定，下列哪项正确？",items:["识别客户的身分，及根据可靠及独立来源核实该客户的身分","金钱服务经营者不得开立或维持匿名户口","须藉对交易进行适当审查，持续监察与客户的业务关系","进行涉及相等于$8,000或以上款额的汇款交易前，须核实汇款人的身分"],answer:4,tip:"以上皆是。《打击洗钱条例》附表2。"},
      {id:12,module:3,stem:"金钱服务经营者须在下列哪些情况就客户执行尽职审查措施？",items:["在与客户建立业务关系之前","为客户执行总值相等于$120,000或以上的非经常交易之前","为客户执行相等于$8,000或以上的电传转帐／汇款之前","怀疑涉及洗钱／恐怖融资时（不论是否达门槛）"],answer:4,tip:"以上皆是。"},
      {id:13,module:3,stem:"关于备存纪录的法定规定，下列哪项正确？",items:["交易纪录一般须自交易完成日起计备存6年","客户身分纪录须在业务关系存续期间备存，并自关系终止日起计备存6年","关长可以书面通知要求备存更长期间的指定纪录","交易完成后满1年即可销毁全部客户身分核证文件"],answer:0,tip:"1–3正确。"},
      {id:14,module:3,stem:"就客户执行尽职审查时，就属法人的客户而言，一般须收集下列哪项识别资料？",items:["注册、成立或登记的日期","注册、成立或登记的地点","公司秘书（作为必然必收的识别资料）","主要营业地点"],answer:1,tip:"1、2、4正确；公司秘书非必然必收。打击洗钱指引第4章。"},
      {id:15,module:3,stem:"关于法团的「最终拥有人」，下列哪项正确？",items:["直接或间接拥有或控制该法团已发行股本的25%以上的个人","直接或间接有权行使该法团成员大会上投票权的25%以上的个人","可行使对该法团管理最终控制权的个人","仅指持股超过75%的单一股东"],answer:0,tip:"1–3正确；门槛是25%或最终控制权。"},

      {id:16,module:4,stem:"金钱服务经营者进行机构层面的洗钱／恐怖分子资金筹集风险评估时，应顾及下列哪类因素？",items:["金钱服务经营者的目标市场及客户类别","金钱服务经营者业务的盈利能力","金钱服务经营者业务的性质、规模、多元程度及复杂程度","金钱服务经营者的交付渠道"],answer:3,tip:"1、3、4正确；盈利能力不是必要因素。打击洗钱指引第2章。"},
      {id:17,module:4,stem:"关于金钱服务经营者持牌人的本地管理办事处规定，下列哪项正确？",items:["无论持牌人会或不会在特定处所经营，都一律必须另设本地管理办事处","本地管理办事处须驻有合规主任、独资经营者、合伙人、董事或最终拥有人","本地管理办事处可让海关人员亲身前往及以电话联络","如未能维持本地管理办事处，将可能导致暂时吊销及撤销牌照"],answer:2,tip:"2、3、4正确；无特定处所经营时才必须维持LMO。《金钱服务经营者牌照指引》第IV条。"},
      {id:18,module:4,stem:"为履行法定的可疑交易举报责任，适当的打击洗钱／恐怖分子资金筹集制度须包括：",items:["委任一名洗钱报告主任","向洗钱报告主任报告前，先由前线人员筛选内部报告","就内部报告、向财富情报组作出报告、作出报告后如何减低风险及防止通风报讯执行清晰的政策和程序","备存内部报告及可疑交易报告的妥善纪录"],answer:3,tip:"1、3、4正确；前线不可先筛选。打击洗钱指引第7章。"},
      {id:19,module:4,stem:"关于合规主任及洗钱报告主任，下列哪项正确？",items:["合规主任作为监督AML制度及合规措施的中心点","洗钱报告主任作为报告可疑交易的中央联络点","除非由独资经营者、合伙人、董事或最终拥有人兼任，否则须为正式雇员","可由秘书公司职员完全外判担任，而无须属申请人雇员"],answer:0,tip:"1–3正确。"},
      {id:20,module:4,stem:"关于用作经营金钱服务的特定处所，下列哪项正确？",items:["纯住宅楼宇内的处所一般被视为不适合登记","位于混合式商住楼宇内的处所，须取得每名占用人书面同意","特定处所招牌所展示的业务名称应与商业登记证相符","即使另一名金钱服务经营者已占用该处所经营，新申请人仍可同时登记同一处所"],answer:0,tip:"1–3正确；已被占用处所不适合。"},

      {id:21,module:5,stem:"关于金钱服务经营者高级管理层的责任，下列哪项正确？",items:["应核准机构的AML风险取向及相关政策","应确保配备足够资源以落实有效管控","应定期检视制度是否足够及有效","把全部合规责任转嫁予前线员工后，高级管理层即可完全免责"],answer:0,tip:"1–3正确；管理层不能转嫁即免责。"},
      {id:22,module:5,stem:"关于能力评核安排，下列哪项正确？",items:["高级管理层中必须有最少一名成员取得合格成绩","能力评核成绩在评定适当人选资格时占相当比重","同属一间公司的应考者必须应考同一时段","任何前线柜员均可不经提名自行应考并作为公司合格资格"],answer:0,tip:"1–3正确。"},
      {id:23,module:5,stem:"关于能力评核的合格标准及模式，下列哪项正确？",items:["试卷共有35条选择题，须于1小时15分钟内完成","分为7个单元，每个单元有5题","每个单元不可答错超过两题，且总分须达25分或以上","只要总分达25分，即使某一单元全错仍属合格"],answer:0,tip:"1–3正确；双门槛须同时满足。"},
      {id:24,module:5,stem:"金钱服务经营者的AML制度，在机构管治层面通常应包括：",items:["经高级管理层核准的政策、程序及管控措施","委任合规主任及洗钱报告主任","与业务风险相称的独立检测／审核安排","完全依赖员工个人常识而无须备存成文政策"],answer:0,tip:"1–3正确。"},
      {id:25,module:5,stem:"关于新牌照申请的能力评核时限，下列哪项正确？",items:["合资格人士须在与海关人员会面当日起计30日内应考","如不及格，可获另一次机会于成绩通知发出当日起计30日后再次应考","未应考或未合格可能导致牌照申请被拒绝","可在获发牌照多年后才首次安排应考"],answer:0,tip:"1–3正确。"},

      {id:26,module:6,stem:"客户尽职审查措施一般包括下列哪些？",items:["识别客户的身分，并采取合理措施核证客户的身分","识别实益拥有人的身分，并采取合理措施核证","如属业务关系，取得有关业务关系的目的及拟具有的性质的资料","对为客户执行的交易进行持续监察"],answer:4,tip:"以上皆是。"},
      {id:27,module:6,stem:"下列哪些情况应考虑采取更严格的尽职审查措施？",items:["客户或实益拥有人属高风险","涉及政治人物并构成较高风险的情况","业务关系或交易涉及高风险司法管辖区","所有本地低风险零售兑换客户一律强制执行更严格尽职审查"],answer:0,tip:"1–3正确。"},
      {id:28,module:6,stem:"有关就客户尽职审查及交易的备存纪录规定，下列哪项数据或资料须作备存之用？",items:["客户的实益拥有人的身分证明文件","任何已作分析的结果","客户的住址资料","客户的开户纪录"],answer:4,tip:"以上皆是。打击洗钱指引第8章。"},
      {id:29,module:6,stem:"关于可疑交易报告，下列哪项正确？",items:["员工如知悉或怀疑交易涉及洗钱／恐怖融资，应按内部程序向洗钱报告主任报告","洗钱报告主任应考虑是否向财富情报组提交可疑交易报告","金钱服务经营者须防止向客户作出通风报讯","为免得罪客户，应先告知客户已就其交易作出可疑交易报告"],answer:0,tip:"1–3正确；告知客户属通风报讯。"},
      {id:30,module:6,stem:"关于名单筛查及金融制裁管控，下列哪项正确？",items:["应设有程序对照适用的制裁／恐怖分子等名单进行筛查","筛查纪录应妥善备存","出现命中或可疑命中时，应有升级处理及跟进程序","只需在开业当日筛查一次，其后永不再更新名单或重做筛查"],answer:0,tip:"1–3正确。"},

      {id:31,module:7,stem:"关于持牌人的定期申报责任，下列哪项正确？",items:["除关长另有指定外，须在每半年开始后的两星期内递交定期申报表","未能按时递交定期申报表，可导致牌照被暂时吊销及／或撤销","定期申报表须以关长指明的格式及方式递交","只需在申请续牌时才首次考虑是否递交申报表"],answer:0,tip:"1–3正确；申报是持续责任。"},
      {id:32,module:7,stem:"下列哪些情况可导致关长撤销或暂时吊销金钱服务经营者牌照？",items:["持牌人、合伙人或董事等不再属适当人选","未能维持本地储存帐目及纪录地点或本地管理办事处（如适用）","未能委任或维持具备合资格的合规主任或洗钱报告主任","未能遵从条例所订规定，包括未按时报交定期申报表"],answer:4,tip:"以上皆是。"},
      {id:33,module:7,stem:"关于独立检测／审核打击洗钱及恐怖分子资金筹集制度，下列哪项正确？",items:["目的是评估制度是否足够及有效运作","应向高级管理层汇报发现的缺失及跟进情况","检测范围应与机构风险及业务性质相称","可完全取代合规主任的日常监督职能"],answer:0,tip:"1–3正确；检测不能取代CO。"},

    const PAPER7 = [
      {id:1,module:1,stem:"某汇款客户每周以小额款项向不同收款人转账，资金来自稳定薪金；客户解释款项用于支持境外个人，而相关人士与某恐怖组织存在关联。以下哪些判断正确？",items:["恐怖分子资金筹集的资金可以来自合法薪金或储蓄","小额及日常化交易不代表没有恐怖融资风险","只要资金来源合法，便不可能构成恐怖分子资金筹集","应结合客户背景、交易目的及收款方关系评估风险"],answer:3,tip:"正确组合为1、2、4（D）。2026年3月讲座明确指出，恐怖融资可使用合法来源，且小额交易可能与日常活动难以区分；因此不能只凭资金来源或金额排除风险。"},
      {id:2,module:1,stem:"关于洗钱与恐怖分子资金筹集的区别，下列哪些描述正确？",items:["洗钱通常旨在掩饰犯罪得益来源，使资金看似合法","恐怖分子资金筹集的动机及目的可能是资助恐怖主义行为，而非追求财务收益","恐怖融资的资金来源只可能是犯罪得益","恐怖融资交易可能涉及小额款项，传统以交易金额为基础的监控未必容易识别"],answer:1,tip:"正确组合为1、2、4（B）。讲座将洗钱与恐怖融资的资金来源、动机及交易模式作出区分；恐怖融资既可使用合法也可使用非法资金。"},
      {id:3,module:1,stem:"某客户以现金及非正规渠道安排汇款，交易金额不大，频率却与其已知收入及业务情况不相称。以下哪些处理思路正确？",items:["现金及非正规经济可能是恐怖融资常见渠道","金钱或价值转移服务及哈瓦拉可能被利用","金额较小即可直接判定交易正常，无须考虑背景","应将交易模式、客户背景及其他可疑迹象综合评估"],answer:3,tip:"正确组合为1、2、4（D）。2026年恐怖融资讲座列出现金、非正规经济、金钱或价值转移服务及哈瓦拉等渠道。金额小不等于风险低，亦不能单凭单一指标作结论。"},
      {id:4,module:1,stem:"有关香港反洗钱及反恐怖分子资金筹集制度的参与者与职能，下列哪些说法正确？",items:["香港海关是规管金钱服务经营者的有关当局","联合财富情报组（JFIU）是本港可疑交易报告机制的管理机构","JFIU本身是负责调查所有洗钱案件的调查单位","FATF制定国际标准，并透过互相评估机制评核成员制度"],answer:3,tip:"正确组合为1、2、4（D）。JFIU讲座明确说明该组并非调查单位，而是接收、分析及储存可疑交易报告，并转交适当调查小组处理。FATF负责国际标准及评估，不是执法机关。"},
      {id:5,module:1,stem:"MSO在评估恐怖融资风险时，发现客户使用电子钱包、预付流动电话卡及线上平台安排资金流动。以下哪些判断较恰当？",items:["数码平台及电子钱包可能被利用作资金渠道","预付流动电话卡销售亦可能出现在相关风险场景","只要使用电子渠道，便自动属于恐怖融资","应把新兴渠道纳入风险识别及持续监察，而非仅关注传统银行转账"],answer:1,tip:"正确组合为1、2、4（B）。2026年讲座指出恐怖融资渠道正在数码化，举出电子钱包及预付流动电话卡等例子。出现某种渠道并不自动证明犯罪，仍须按风险及具体事实评估。"},
      {id:6,module:2,stem:"某公司拟在香港经营汇款及货币兑换服务，负责人认为公司已完成商业登记，故可先营业再补办MSO牌照。以下哪些说法正确？",items:["货币兑换服务及汇款服务均属于金钱服务","经营金钱服务前必须领有牌照","无牌经营可能面对最高罚款100万元及监禁2年","商业登记证本身等同MSO牌照"],answer:0,tip:"正确组合为1、2、3（A）。2026年3月24日发牌规定讲座指出，金钱服务包括货币兑换及汇款，经营前必须领牌；无牌经营最高罚款100万元及监禁2年。商业登记不能代替MSO牌照。"},
      {id:7,module:2,stem:"申请人拟新增一个金钱服务经营处所，并打算在海关批准前先接待客户试营业。以下哪些理解正确？",items:["新增特定处所须按规定向海关申请","处所须适合用作经营金钱服务，并可让海关人员进入执行监管职能","只要业主口头同意，便可不理会处所用途及其他适用要求","在取得所需批准前，不应在新增处所擅自经营金钱服务"],answer:1,tip:"正确组合为1、2、4（B）。发牌讲座强调特定处所须适合登记，并应可供海关人员进入。新增处所须按规定申请，不能以业主口头同意取代监管批准。"},
      {id:8,module:2,stem:"关长评估法团申请人是否适当人选时，发现一名董事曾涉及刑事程序，另一名最终拥有人曾不遵从牌照条件。以下哪些说法正确？",items:["董事及最终拥有人均可能属于适当人选审查范围","曾面对刑事或纪律程序可成为考虑因素","曾不遵从关长施加的牌照条件可成为相关考虑因素","只需审查法团本身，董事及最终拥有人一概不在审查范围"],answer:0,tip:"正确组合为1、2、3（A）。《打击洗钱条例》第5部及适当人选补充指引涵盖个人、合伙人、董事及最终拥有人；补充指引亦列出不遵从牌照条件等相关事宜。"},
      {id:9,module:2,stem:"某持牌人发现申请及续牌时提交给关长的资料发生改变，但认为只要变化不影响实际交易便无须通知。以下哪些说法正确？",items:["与牌照申请或续期有关的已提供详情如有改变，须按规定书面具报","相关详情改变的具报期限为改变发生日起计一个月内","是否具报可完全由持牌人自行决定","具报责任与改变是否已经造成客户损失并无必然关系"],answer:3,tip:"正确组合为1、2、4（D）。参考试题及《打击洗钱条例》第5部均指出，相关详情改变须在发生日起计一个月内书面向关长具报，不能以尚未造成损失为由自行豁免。"},
      {id:10,module:2,stem:"某持牌人计划停止经营金钱服务，但希望保留牌照并在停业后继续以持牌MSO名义招揽客户。以下哪些说法正确？",items:["拟停业须在停业日期前以书面向关长具报意向及日期","须按规定在停业日期起计7日内交回牌照","只要牌照尚未到期，停业后仍可继续以该牌照名义经营","停业及交回牌照属于不同时间节点的责任"],answer:1,tip:"正确组合为1、2、4（B）。Set C及官方参考试题均列明停业前书面具报，以及停业日起计7日内交回牌照。牌照未到期不代表可在停止经营后继续营业。"},
      {id:11,module:3,stem:"MSO为一名新客户建立持续汇款业务关系。客户尚未提出第一笔汇款，职员认为交易金额未达任何门槛，因此可先建立关系、日后再做核实。以下哪些说法正确？",items:["建立业务关系前须执行客户尽职审查","怀疑客户或其户口涉及洗钱／恐怖分子资金筹集时，不受一般金额门槛限制","只有单笔交易达到120,000港元才需要任何客户尽职审查","CDD包括识别客户身份及采取合理措施核实身份"],answer:3,tip:"正确组合为1、2、4（D）。Set B、Set C及《打击洗钱指引》第4章列出建立业务关系前及怀疑涉及洗钱／恐怖融资时的CDD触发情况。CDD并非只由单一交易金额决定。"},
      {id:12,module:3,stem:"客户在同一天分多笔向同一收款人汇款，每笔均略低于相关门槛；交易资料显示各笔交易可能彼此有关连。以下哪些说法正确？",items:["应留意一连串有关连的非经常交易是否合计达到适用门槛","刻意拆分交易不能自动令MSO免除CDD责任","只要每笔单独低于门槛，便绝对无须进一步评估","怀疑涉及洗钱或恐怖融资时，即使金额较低亦须执行CDD"],answer:3,tip:"正确组合为1、2、4（D）。参考试题及《打击洗钱指引》第4章要求留意有关连交易及怀疑情况。不能机械地逐笔拆开计算，更不能忽略可疑迹象。"},
      {id:13,module:3,stem:"MSO依赖中介人执行部分客户尽职审查措施。中介人表示资料可在其方便时提供，且会在服务结束后自行销毁。以下哪些说法正确？",items:["MSO须信纳中介人会应要求尽快提供相关文件副本或数据／资料纪录","MSO须取得中介人书面确认同意担任中介人","如纪录由中介人备存，MSO须确保可在规定期间内取得有关纪录","MSO可把法定责任完全转移给中介人，毋须自行确保安排妥当"],answer:0,tip:"正确组合为1、2、3（A）。Set A及Set C关于中介人的题目强调书面同意、应要求没有延误地提供资料，以及纪录备存安排。依赖中介人不等于转移MSO本身的责任。"},
      {id:14,module:3,stem:"某法团客户由多层公司及信托持有。前线只记录直接股东名称，未识别最终控制该法团的自然人。以下哪些说法正确？",items:["须识别法团的实益拥有人","实益拥有人可包括直接或间接拥有／控制法团已发行股本25%以上的自然人","有权行使成员大会25%以上投票权的人士可能属于实益拥有人","只要客户提供公司注册证书，便可一概免除实益拥有人识别工作"],answer:0,tip:"正确组合为1、2、3（A）。Set C第14题列出25%股本、25%投票权及最终管理控制等概念。多层持股或信托安排并不会自动免除识别实益拥有人责任。"},
      {id:15,module:3,stem:"某客户的身份证明文件及交易纪录已完成电子化，业务关系其后终止。职员建议立即删除所有文件以减少资料储存成本。以下哪些说法正确？",items:["交易纪录须按规定自交易完成日起计至少备存5年","客户身分纪录须在业务关系存续期间备存，并按规定在关系终止后继续备存","法规容许以微缩影片或电脑数据库备存文件副本（须符合规定）","业务关系终止本身并不代表可立即销毁所有纪录"],answer:4,tip:"正确组合为以上皆是（E）。Set B、Set C及《打击洗钱指引》第8章均强调纪录备存义务及期限；电子化或关系终止均不能成为即时销毁的理由。"},
      {id:16,module:4,stem:"MSO准备进行机构层面的洗钱／恐怖分子资金筹集风险评估。管理层拟只按营业额及盈利能力决定风险级别。以下哪些因素亦应纳入评估？",items:["目标市场及客户类别","业务性质、规模、多元程度及复杂程度","交付渠道","业务盈利能力是唯一必须考虑的风险因素"],answer:3,tip:"正确组合为1、2、3（D）。官方参考试题明确列出目标市场及客户类别、业务性质／规模／多元／复杂程度，以及交付渠道；盈利能力并非该题所指的必要核心因素。"},
      {id:17,module:4,stem:"某MSO不在特定处所经营金钱服务，拟以本地管理办事处模式运作。以下哪些安排符合资料所述要求？",items:["在没有特定处所经营的情况下，须适用本地管理办事处安排","办事处应可供海关人员亲身前往及以电话联系","办事处内须有符合指引所列身份要求的人员驻守","仅租用虚拟邮箱地址便必然满足本地管理办事处要求"],answer:0,tip:"正确组合为1、2、3（A）。Set A及2026年3月发牌规定讲座指出，LMO适用于没有特定处所经营的情况，并须满足可联系、可亲访及人员安排等要求。"},
      {id:18,module:4,stem:"某MSO把合规主任（CO）及洗钱报告主任（MLRO）职责交由同一名合资格董事兼任。以下哪些说法正确？",items:["CO负责监督AML/CFT制度及合规措施","MLRO是处理可疑交易报告的中央联络点","两项职能可按适用规定由合资格人士兼任","只要委任了MLRO，机构便无须建立内部报告程序"],answer:0,tip:"正确组合为1、2、3（A）。《打击洗钱指引》第3及7章分别说明合规职能与可疑交易报告安排。委任人员不能替代机构建立清晰政策、程序及内部报告渠道的责任。"},
      {id:19,module:4,stem:"某分店员工发现客户交易异常，先向直属经理口头提及；经理认为客户是长期客户，要求员工不要记录，也不要提交内部报告。以下哪些制度要求适用？",items:["职员应获得足够指引以识别可疑交易","机构应有清晰程序，使全体职员知悉MLRO身份及内部报告方法","内部报告应迅速、保密及无障碍地送交MLRO","内部报告可由直属经理自行决定是否记录，毋须依循既定程序"],answer:0,tip:"正确组合为1、2、3（A）。Set B有关可疑交易识别及内部报告的题目强调员工指引、清晰程序，以及报告迅速、保密及无障碍。客户关系长短不构成不记录的理由。"},
      {id:20,module:4,stem:"持牌人拟在混合式商住大厦登记特定处所，处所入口与另一业务共用，招牌名称亦与商业登记证上的业务名称不同。以下哪些事项需要特别处理？",items:["确认处所是否符合适用物业用途及登记要求","按规定取得相关占用人的书面同意（如适用）","确保招牌展示的业务名称与商业登记资料相符","只要租约已签署，处所便自动符合所有海关登记要求"],answer:0,tip:"正确组合为1、2、3（A）。Set A及Set C的处所题目指出物业用途、共用入口、占用人同意及招牌名称均可能影响处所是否适合登记；租约本身不能取代这些审查。"},
      {id:21,module:5,stem:"某MSO高级管理层认为AML/CFT制度属于CO个人职责，因此董事会无须审批政策或了解监察结果。以下哪些说法正确？",items:["高级管理层应核准机构风险取向及AML/CFT政策","高级管理层应确保有足够资源落实管控措施","高级管理层应定期检视制度是否足够及有效","委任CO后，高级管理层便可完全免除监督责任"],answer:0,tip:"正确组合为1、2、3（A）。《打击洗钱指引》第3章强调高级管理层的管治责任。委任CO是制度安排之一，并非把管理层监督责任完全转移。"},
      {id:22,module:5,stem:"MSO在设计机构风险评估程序时，只保留最终风险等级，没有记录风险识别过程或数据来源。以下哪些做法更符合指引？",items:["记录风险评估程序，包括识别及评估风险的步骤","运用相关内部及外部来源的定性与定量分析及资料","在厘定整体风险水平及减低风险措施前考虑相关风险因素","无须记录评估依据，只要管理层口头确认即可"],answer:0,tip:"正确组合为1、2、3（A）。Set A第21题及《打击洗钱指引》第2章强调评估程序、内外部资料、定性与定量分析及管理层审批。只留最终等级不足以展示评估过程。"},
      {id:23,module:5,stem:"某MSO已安排员工参加培训，但没有保存出席纪录、培训内容或评估结果。检查时无法证明员工曾接受相关训练。以下哪些说法正确？",items:["培训应与员工职责及机构风险相称","培训应帮助员工识别洗钱及恐怖融资迹象并理解报告程序","备存培训纪录有助证明培训制度已落实","只要曾支付培训费用，便无须保留任何培训证据"],answer:0,tip:"正确组合为1、2、3（A）。《打击洗钱指引》第9章及Set C培训题强调适当培训及相关记录。单有付款记录不能证明培训内容、参与人员及实际落实情况。"},
      {id:24,module:5,stem:"独立检测人员发现多个分店重复出现客户资料缺漏。管理层要求检测人员只报告问题数量，不分析成因或跟进整改。以下哪些做法较恰当？",items:["检测应评估AML/CFT制度是否足够及有效运作","检测结果及重大缺失应向适当管理层汇报","应跟进整改并考虑验证措施是否有效","独立检测只需统计问题数量，不应提出任何改进意见"],answer:0,tip:"正确组合为1、2、3（A）。《打击洗钱指引》第3及8章的制度逻辑要求检测、管理层汇报及整改跟进。反复出现的缺失更需要分析原因和验证改进成效。"},
      {id:25,module:5,stem:"某公司提名一名并非独资经营者、合伙人或董事的普通前线职员参加MSO能力评核，并认为该职员通过后即可满足公司高级管理层评核要求。以下哪些理解正确？",items:["能力评核旨在确保高级管理层具备基本AML/CFT知识","合资格应考人士须符合能力评核须知所列的身份条件","公司须按规定确保有关高级管理层成员完成能力评核要求","任何员工通过考试均自动取代公司适用的高级管理层要求"],answer:0,tip:"正确组合为1、2、3（A）。能力评核须知说明评核对象与高级管理层及牌照申请要求相关，不能把任何员工的合格成绩视为自动满足全部公司发牌条件。"},
      {id:26,module:6,stem:"某客户长期进行汇款，近期交易目的、收款对象及金额模式均明显偏离其既有资料。职员只在开户时完成过一次CDD。以下哪些做法正确？",items:["应持续监察交易，以判断其是否符合对客户的认知","出现资料不一致时，应按风险考虑进一步查询及更新CDD资料","持续监察不应只限于开户时的一次性检查","客户已是长期客户，因此其交易可永久豁免持续监察"],answer:0,tip:"正确组合为1、2、3（A）。《打击洗钱指引》第5章要求持续监察；长期客户身份不能取代对交易与客户背景是否相符的持续评估。"},
      {id:27,module:6,stem:"某客户被识别为政治人物（PEP），MSO拟建立业务关系。以下哪些做法属于较严格尽职审查的相关考虑？",items:["考虑该政治人物所担任的重要公职及相关风险","采取合理措施确立客户或实益拥有人的财富来源及拟涉资金来源","按业务关系性质及相关司法管辖区风险决定措施程度","发现客户属PEP便必然须不作任何评估而立即拒绝所有交易"],answer:0,tip:"正确组合为1、2、3（A）。Set B有关PEP的题目强调按公职、地区风险及业务关系性质评估风险，并采取合理措施确立财富来源及资金来源。PEP身份不等同自动拒绝。"},
      {id:28,module:6,stem:"MSO的筛查系统发现客户姓名与制裁名单中的姓名相似，但出生日期及其他身份资料尚未核实。以下哪些处理方式正确？",items:["应及时核实潜在匹配的身份及相关资料","应按内部升级程序处理真实或疑似命中","应保存筛查结果及处理纪录","可由经办员工直接忽略相似姓名而不留纪录"],answer:0,tip:"正确组合为1、2、3（A）。2026年合规职能讲座及Set C筛查题强调名单筛查、命中升级及纪录保存。相似姓名不是自动确认命中，但亦不能未经核实便忽略。"},
      {id:29,module:6,stem:"员工怀疑客户交易涉及洗钱，向MLRO提交内部报告。客户随后询问机构是否已向当局举报。以下哪些做法正确？",items:["机构应防止向客户通风报讯","员工应依内部程序向MLRO报告怀疑","是否向JFIU提交可疑交易报告，应由负责职能按程序考虑","为维护客户关系，员工可以向客户披露已提交或拟提交的报告"],answer:0,tip:"正确组合为1、2、3（A）。《打击洗钱指引》第7章及JFIU讲座强调内部报告、可疑交易报告程序及防止通风报讯。向客户披露受限制资料可能构成通风报讯。"},
      {id:30,module:6,stem:"某分店员工认为可疑交易报告必须等到确认客户已犯罪后才提交内部报告。以下哪些说法正确？",items:["内部报告不应以确认犯罪为前提","员工应在产生怀疑时按内部程序报告","JFIU负责接收、分析及储存可疑交易报告，并转交适当调查小组","JFIU是负责亲自调查所有洗钱案件的调查单位"],answer:0,tip:"正确组合为1、2、3（A）。2025年JFIU讲座明确说明JFIU并非调查单位；其职能包括接收、分析及储存报告，并转交适当调查小组。怀疑不需要先达到刑事定罪证明程度。"},
      {id:31,module:7,stem:"持牌人准备2025年下半年的定期申报表，财务部门仍按旧制度准备每季纸本申报，并计划邮寄给海关。以下哪些说法正确？",items:["自2025年6月30日调整后，定期申报安排改为每半年一次","新安排的申报表须经MSO牌照系统电子服务递交","海关不再接受纸本定期申报表","申报资料包括汇款交易涉及的司法管辖区及所用交付渠道等额外数据"],answer:4,tip:"正确答案为以上皆是（E）。2025年5月30日海关通函明确规定半年申报、电子递交及不再接受纸本，并要求提供外币、汇款司法管辖区及交付渠道等额外资料。"},
      {id:32,module:7,stem:"某持牌人于半年内没有进行任何交易，管理层因此决定不提交该期定期申报表，也没有查阅牌照系统的要求。以下哪些说法正确？",items:["持牌人须按关长指定格式及方式递交适用定期申报表","不能仅凭当期没有交易便自行决定豁免规定申报","未按时递交定期申报表可导致牌照被暂时吊销及／或撤销","定期申报只在申请续牌时才需要处理"],answer:0,tip:"正确组合为1、2、3（A）。2025年5月30日通函及Set C定期申报题说明申报是持续监管责任，逾期可能导致暂时吊销及／或撤销。是否需要提交须依关长指定要求判断，不能自行豁免。"},
      {id:33,module:7,stem:"海关进行例行合规视察时，要求进入持牌人的业务处所，并抽查客户及交易纪录。持牌人以商业机密为由拒绝提供任何纪录。以下哪些理解正确？",items:["2026年合规职能讲座指出，条例第9条下可进行例行合规视察","视察可涉及进入业务处所及查阅、复制或复印规定须备存的客户或交易纪录","持牌人应妥善保存纪录，以便履行监管要求","只要纪录属于商业机密，持牌人便可一概拒绝监管查阅"],answer:0,tip:"正确组合为1、2、3（A）。2026年3月24日合规职能讲座列明第9条例行合规视察可进入业务处所及抽查指明纪录。商业机密并非一概拒绝法定监管检查的理由。"},
      {id:34,module:7,stem:"海关考虑是否就持牌人的违规行为施加罚款。违规持续数月、重复发生，持牌人曾试图隐瞒，且事件可能损害客户利益。以下哪些因素与罚款评估有关？",items:["违规行为的性质、严重性及影响","违规行为持续时间及频密程度","行为属蓄意、罔顾后果或疏忽，以及有否隐瞒","只要持牌人规模较小，便必然不会被施加罚款"],answer:0,tip:"正确组合为1、2、3（A）。《施加罚款纪律行动指引》列明违规性质、严重性、影响、持续时间、频密程度、行为性质及隐瞒情况等因素。持牌人规模及财政资源会被考虑，但不构成自动豁免。"},
      {id:35,module:7,stem:"某MSO通过能力评核后，管理层宣布公司已全面符合所有监管要求，因而停止更新政策、培训及监察。以下哪些说法正确？",items:["通过能力评核不代表自动满足所有发牌条件","持牌人仍须持续遵守适用法例、牌照条件及监管指引","应持续进行培训、监察及保存合规证据","通过考试后可永久豁免后续合规责任"],answer:0,tip:"正确组合为1、2、3（A）。能力评核须知说明其目的在于确保高级管理层具备基本知识，以监督机构AML/CFT制度；它不是持续合规义务的替代品。"}
    ];


    // Paper 8: long-form official-style combination questions (four statements + A-E combinations)
    const PAPER8 = [
      {id:1,module:1,variant:"official-long",stem:"某金錢服務經營者檢視一名新客戶的交易安排時，發現客戶擬以多筆小額匯款，分別經不同收款人轉移資金；客戶所述用途與其職業及收入水平並不完全吻合。就洗錢、恐怖分子資金籌集及風險為本方法，下列哪幾項描述正確？",items:["洗錢常見階段包括存放、分層及整合，分層可涉及多層交易以掩飾資金來源","恐怖分子資金籌集所涉及的資金必然全部來自犯罪得益","拆分交易及交易模式與客戶背景不相稱，均可構成需要進一步評估的風險警號","金錢服務經營者應按整體情況及已識別風險決定適當的審查和監察措施"],answer:1,tip:"正確答案：B（1、3及4）。洗錢三階段為存放、分層及整合；恐怖融資資金亦可能來自合法來源，因此第2項錯誤。拆分交易及交易與客戶背景不符均須納入風險評估。參考《打擊洗錢指引》第1、2及5章。"},
      {id:2,module:1,variant:"official-long",stem:"某MSO更新機構層面的洗錢及恐怖分子資金籌集風險評估時，管理層提出只需檢視客戶的國籍及交易金額，其他業務因素可留待出現可疑交易時才處理。就機構風險評估的範圍及方法，下列哪幾項描述正確？",items:["風險評估應考慮目標市場及客戶類別等客戶風險因素","產品、服務、交易或交付渠道的特點亦可能影響機構風險水平","業務性質、規模、多元程度及複雜程度均可納入評估","只要機構曾完成一次風險評估，日後即使業務模式有重大改變亦毋須檢視"],answer:0,tip:"正確答案：A（1、2及3）。評估須涵蓋客戶、產品／服務、交易及交付渠道，以及業務性質、規模和複雜程度；重大變化時應重新檢視。參考《打擊洗錢指引》第2章。"},
      {id:3,module:1,variant:"official-long",stem:"某客戶以合法薪金作為資金來源，但其交易對象及交易目的與恐怖分子資金籌集風險資料出現關聯。前線職員認為資金來源合法，而且每筆交易金額不高，因此毋須向上級反映。就恐怖融資風險的識別，下列哪幾項描述正確？",items:["恐怖融資可使用合法來源的資金，不能單憑資金來源合法便排除風險","恐怖融資交易可能涉及小額款項，未必容易透過傳統金額門檻識別","只要交易未達一般客戶盡職審查金額門檻，便不可能構成恐怖融資風險","應結合客戶背景、交易目的、收款方及其他相關資料作整體評估"],answer:3,tip:"正確答案：D（1、2及4）。恐怖融資資金來源可以合法，交易亦可能小額及日常化；不能只憑金額或資金來源排除風險。參考2026年3月MSO Seminar恐怖分子資金籌集內容及《打擊洗錢指引》第2章。"},
      {id:4,module:1,variant:"official-long",stem:"某MSO準備修訂制裁及指定名單篩查程序。現行安排只在客戶首次開戶時進行一次姓名比對，之後即使名單更新或交易對手改變，亦不會重新檢查。就名單篩查及相關風險控制，下列哪幾項描述正確？",items:["應按適用要求及機構風險建立相關名單篩查程序","篩查出現潛在匹配時，應按程序核實及升級處理，而非未經核實便直接忽略","篩查及處理結果應保留適當紀錄，以便展示制度如何執行","只要首次篩查沒有命中，便可永久停止更新名單及後續篩查"],answer:0,tip:"正確答案：A（1、2及3）。首次沒有命中不代表往後永遠沒有風險；名單及客戶／交易資料可能改變，須按適用程序持續執行篩查及保存處理紀錄。參考《打擊洗錢指引》第6章及相關MSO Seminar。"},
      {id:5,module:1,variant:"official-long",stem:"某MSO的合規主任向管理層解釋風險為本方法時，指出制度不應只按交易金額設定單一門檻，而應將客戶、產品及服務特徵一併考慮。就風險為本方法，下列哪幾項描述正確？",items:["管控措施的性質及程度應與已識別的洗錢及恐怖融資風險相稱","所有客戶不論風險高低，均必須採取完全相同的加強盡職審查措施","較高風險情況一般須採取較嚴格的盡職審查及持續監察措施","風險評估應有助機構決定資源分配及管控措施的優先次序"],answer:1,tip:"正確答案：B（1、3及4）。風險為本方法並非對所有客戶一律採取相同措施；應按風險程度調整措施及資源。參考《打擊洗錢指引》第2章。"},
      {id:6,module:2,variant:"official-long",stem:"某公司已取得商業登記證，並計劃在香港提供貨幣兌換及匯款服務。負責人認為商業登記已足以證明公司可經營有關業務，故打算先開始營業，再向海關補交牌照申請。就MSO發牌制度，下列哪幾項描述正確？",items:["貨幣兌換及匯款均屬金錢服務的範圍","任何人經營金錢服務前，須按《打擊洗錢條例》取得所需牌照","香港海關是金錢服務經營者的有關監管當局","商業登記證可取代金錢服務經營者牌照，故毋須另行申請"],answer:0,tip:"正確答案：A（1、2及3）。商業登記不等同MSO牌照；經營金錢服務前須取得牌照。無牌經營可構成刑事罪行。參考《打擊洗錢條例》第5部及2026年3月發牌規定講座。"},
      {id:7,module:2,variant:"official-long",stem:"某法團申請成為金錢服務經營者。申請人認為關長只會審查公司本身的財務狀況，因此沒有整理董事、合夥人或最終擁有人的相關資料。就適當人選審查，下列哪幾項描述正確？",items:["適當人選審查可涵蓋申請人及條例／指引所列的相關個人","法團申請人的董事可能屬於審查範圍","法團的最終擁有人亦可能屬於審查範圍","只要法團已完成商業登記，關長便不得考慮其董事或最終擁有人的情況"],answer:0,tip:"正確答案：A（1、2及3）。適當人選審查並非只針對法團本身；董事及最終擁有人等適用人士亦可能納入考慮。參考《打擊洗錢條例》第5部及適當人選補充指引。"},
      {id:8,module:2,variant:"official-long",stem:"某持牌人於日常營運期間更改了與牌照申請有關的部分資料。負責人認為只要改動沒有即時影響客戶交易，便可待下次續牌時才一併通知海關。就牌照資料變更的具報責任，下列哪幾項描述正確？",items:["與牌照申請或續期有關的已提供詳情如有改變，須按規定向關長具報","相關詳情改變一般須於改變發生日起計一個月內以書面具報","是否需要具報可完全由持牌人按改動的重要程度自行決定","具報責任不以已造成客戶損失或實際違規為前提"],answer:3,tip:"正確答案：D（1、2及4）。持牌人不能自行決定是否具報；相關詳情改變須按規定於一個月內書面通知。參考《打擊洗錢條例》第5部及MSO牌照指引。"},
      {id:9,module:2,variant:"official-long",stem:"某MSO持牌人計劃停止經營金錢服務。管理層已向客戶發出停業通知，但認為只要牌照仍未屆滿，便可在停止經營後繼續以原牌照名義招攬新客戶。就停業及牌照交回事宜，下列哪幾項描述正確？",items:["持牌人須按規定在停業日期前以書面向關長具報停業意向及日期","持牌人須按規定在停業日期起計七日內交回牌照","只要牌照尚未屆滿，停業後仍可無限期以該牌照繼續經營","停業前具報與停業後交回牌照屬不同時間點的責任"],answer:3,tip:"正確答案：D（1、2及4）。停業前書面具報及停業日起計七日內交回牌照是不同責任；牌照尚未屆滿不代表可在停業後繼續營業。參考MSO牌照指引及官方參考試題。"},
      {id:10,module:2,variant:"official-long",stem:"某申請人已遞交續牌申請，並認為提交申請即代表牌照會自動延續，因此沒有檢視有關人士是否仍符合適當人選準則，也沒有回應海關要求補交的資料。就牌照續期，下列哪幾項描述正確？",items:["持牌人應留意牌照屆滿日期，並按指定期限及方式提出續期申請","提交續期申請本身並不保證續牌必然獲批","續期時仍須符合適用的適當人選及其他發牌要求","只要曾經獲發牌照，日後續期便不得再要求提供資料"],answer:0,tip:"正確答案：A（1、2及3）。續期並非自動批准；關長可按適用要求評估申請及要求相關資料。參考MSO牌照指引。"},
      {id:11,module:3,variant:"official-long",stem:"某MSO為客戶建立持續匯款業務關係。前線職員認為客戶尚未進行第一筆交易，而且預計交易金額不高，因此可先建立關係，待日後交易達到指定金額才進行客戶盡職審查。就CDD觸發時點，下列哪幾項描述正確？",items:["建立業務關係前須按規定執行客戶盡職審查措施","懷疑涉及洗錢或恐怖分子資金籌集時，不能單憑交易金額低於一般門檻而不執行CDD","只有單筆非經常交易達到指定金額，才可能需要執行任何CDD","CDD包括識別客戶身分及採取合理措施核實身分"],answer:3,tip:"正確答案：D（1、2及4）。建立業務關係前已是CDD觸發情況；懷疑涉及洗錢／恐怖融資時亦不應以金額門檻作豁免。參考《打擊洗錢條例》附表2及《打擊洗錢指引》第4章。"},
      {id:12,module:3,variant:"official-long",stem:"某客戶在同一天分多筆向同一收款人匯款，每筆金額均略低於相關門檻。交易資料顯示各筆款項可能彼此有關連，而客戶亦拒絕解釋拆分原因。就有關連交易及CDD，下列哪幾項描述正確？",items:["應留意一連串有關連的非經常交易是否合計達到適用門檻","刻意拆分交易不能自動令MSO免除CDD責任","只要每筆交易單獨低於門檻，便絕對毋須進一步評估","如懷疑涉及洗錢或恐怖融資，即使金額較低亦須按規定處理"],answer:3,tip:"正確答案：D（1、2及4）。不能機械地逐筆拆開計算而忽略有關連交易；懷疑情況亦不受一般金額門檻限制。參考《打擊洗錢指引》第4章及官方參考試題。"},
      {id:13,module:3,variant:"official-long",stem:"某MSO依賴中介人執行部分客戶盡職審查措施。中介人表示可在服務結束後才提供資料，並會自行決定是否保存文件。就依賴中介人執行CDD，下列哪幾項描述正確？",items:["MSO須信納中介人會應要求盡快提供相關文件副本或資料紀錄","按適用要求，MSO須取得中介人書面確認同意擔任中介人","如紀錄由中介人備存，MSO須確保可在規定期間內取得有關紀錄","MSO可把全部法定責任轉移予中介人，毋須確保安排妥當"],answer:0,tip:"正確答案：A（1、2及3）。依賴中介人不等於轉移MSO本身責任；須確保資料可及時提供及紀錄安排符合規定。參考官方參考試題及《打擊洗錢指引》第4章。"},
      {id:14,module:3,variant:"official-long",stem:"某法團客戶由多層公司及信託持有。前線只記錄直接股東名稱，並以公司註冊證書作為完成CDD的唯一依據，沒有進一步識別最終控制該法團的自然人。就實益擁有人識別，下列哪幾項描述正確？",items:["MSO須按規定識別法團客戶的實益擁有人","直接或間接擁有或控制法團已發行股本25%以上的自然人，可能屬實益擁有人","有權行使法團成員大會25%以上投票權的人士，亦可能屬實益擁有人","只要取得公司註冊證書，便可一概免除識別實益擁有人的工作"],answer:0,tip:"正確答案：A（1、2及3）。實益擁有人概念包括直接或間接持股、投票權及最終控制權；多層持股或信託不會自動豁免識別責任。參考《打擊洗錢指引》第4章及官方參考試題。"},
      {id:15,module:3,variant:"official-long",stem:"某客戶的身分證明文件及交易紀錄已完成電子化，業務關係其後終止。職員建議立即刪除所有檔案，以減少資料儲存成本。就紀錄備存，下列哪幾項描述正確？",items:["交易紀錄須按適用規定自交易完成日起計備存指定期間","客戶身分紀錄須在業務關係存續期間備存，並在關係終止後繼續備存指定期間","在符合規定的情況下，可使用微縮影片或電腦資料庫等方式備存文件","業務關係終止本身並不代表可立即銷毀所有客戶及交易紀錄"],answer:4,tip:"正確答案：E（以上皆是）。紀錄備存有法定期限，電子化不會免除備存責任；關係終止亦不是即時銷毀的理由。參考《打擊洗錢指引》第8章及官方參考試題。"},
      {id:16,module:4,variant:"official-long",stem:"某MSO沒有在特定處所經營金錢服務，擬以本地管理辦事處模式運作。管理層只租用虛擬辦公室及郵政信箱，認為有地址即可符合要求。就本地管理辦事處，下列哪幾項描述正確？",items:["在沒有特定處所經營的情況下，須按適用要求維持本地管理辦事處安排","辦事處須可供海關人員親身前往及以電話聯絡","辦事處須有符合指引所列身份要求的人員駐守","單純設置虛擬郵箱便必然符合本地管理辦事處的全部要求"],answer:0,tip:"正確答案：A（1、2及3）。本地管理辦事處安排不只是提供郵寄地址，亦涉及可聯絡、可親訪及適當人員駐守等要求。參考MSO牌照指引第IV部分及發牌規定講座。"},
      {id:17,module:4,variant:"official-long",stem:"某MSO在混合式商住大廈申請登記特定處所。該處所與其他單位共用入口，招牌名稱亦與商業登記證上的業務名稱不同。申請人認為只要已簽署租約，便毋須再檢視其他條件。就特定處所的適合性，下列哪幾項描述正確？",items:["須考慮處所用途及是否適合用作經營金錢服務","在適用情況下，須取得相關佔用人的書面同意","招牌展示的業務名稱應符合牌照指引所列要求","簽署租約本身足以取代海關對處所的審查及批准"],answer:0,tip:"正確答案：A（1、2及3）。租約不會取代處所用途、佔用人同意及招牌名稱等審查。參考MSO牌照指引及官方參考試題。"},
      {id:18,module:4,variant:"official-long",stem:"某MSO委任一名合資格董事兼任合規主任（CO）及洗錢報告主任（MLRO）。管理層認為既然已委任相關人員，機構便不需要再制定內部報告程序或保存處理紀錄。就CO及MLRO的職能，下列哪幾項描述正確？",items:["CO負責監督機構AML/CFT制度及相關合規措施","MLRO是處理可疑交易報告的中央聯絡點","在符合適用要求的情況下，相關職能可由合資格人士兼任","委任MLRO後，機構便毋須建立內部報告渠道及程序"],answer:0,tip:"正確答案：A（1、2及3）。委任CO及MLRO不能取代機構建立清晰政策、內部報告渠道及紀錄安排的責任。參考《打擊洗錢指引》第3及7章。"},
      {id:19,module:4,variant:"official-long",stem:"某分店員工發現客戶交易異常，先向直属經理口頭提及；經理認為客戶是長期客戶，要求員工不要記錄，也不要提交內部報告。就可疑交易內部舉報制度，下列哪幾項描述正確？",items:["職員應獲得足夠指引，以識別可能涉及洗錢或恐怖融資的交易","機構應有清晰程序，使職員知悉MLRO身份及內部報告方法","內部報告應迅速、保密及無障礙地送交MLRO","是否記錄內部報告可完全由直屬經理自行決定，毋須依循既定程序"],answer:0,tip:"正確答案：A（1、2及3）。客戶關係長短不構成不記錄或不報告的理由；機構須建立清晰內部報告制度。參考《打擊洗錢指引》第7章。"},
      {id:20,module:4,variant:"official-long",stem:"某MSO準備建立內部合規制度，但管理層只口頭向員工說明處理可疑交易的方式，沒有正式政策、程序或紀錄。管理層認為公司規模小，因此可以完全依賴員工個人經驗。就AML/CFT制度安排，下列哪幾項描述正確？",items:["機構應制定與其業務及風險相稱的政策、程序及管控措施","員工應清楚知悉識別及報告可疑交易的程序","相關制度及執行情況應保留適當紀錄，以便展示合規","機構規模小便可自動豁免所有成文政策及紀錄要求"],answer:0,tip:"正確答案：A（1、2及3）。制度須與風險及業務相稱，但並非因規模小便可一概免除政策、程序及紀錄安排。參考《打擊洗錢指引》第3及7章。"},
      {id:21,module:5,variant:"official-long",stem:"某MSO高級管理層認為打擊洗錢及恐怖分子資金籌集制度完全屬於CO個人職責，因此董事會無須審批政策、分配資源或了解監察結果。就高級管理層的管治責任，下列哪幾項描述正確？",items:["高級管理層應核准機構的AML/CFT政策及風險取向","高級管理層應確保有足夠資源落實適當管控措施","高級管理層應定期檢視制度是否足夠及有效","委任CO後，高級管理層便可完全免除監督責任"],answer:0,tip:"正確答案：A（1、2及3）。委任CO是管治制度的一部分，不能把高級管理層的監督責任完全轉移。參考《打擊洗錢指引》第3章。"},
      {id:22,module:5,variant:"official-long",stem:"某MSO進行機構風險評估時，只保留最終風險等級，沒有記錄識別風險的步驟、資料來源或評估依據。管理層認為只要口頭確認結果便足夠。就風險評估程序及紀錄，下列哪幾項描述正確？",items:["應記錄風險評估程序，包括識別及評估風險的步驟","可運用相關內部及外部來源的定性與定量資料","在厘定整體風險水平及減低風險措施前，應考慮相關風險因素","只須保留最終風險級別，完全毋須記錄評估依據"],answer:0,tip:"正確答案：A（1、2及3）。只保留最終級別不足以展示評估如何進行；應有程序、資料來源及評估依據。參考《打擊洗錢指引》第2章。"},
      {id:23,module:5,variant:"official-long",stem:"某MSO安排員工參加AML/CFT培訓，但沒有保存出席紀錄、課程內容或評估結果。監管視察時，機構無法證明員工曾接受相關訓練。就員工培訓及紀錄，下列哪幾項描述正確？",items:["培訓內容應與員工職責及機構風險相稱","培訓應協助員工識別洗錢及恐怖融資跡象，並理解內部報告程序","備存培訓紀錄有助展示培訓制度已實際落實","只要機構曾支付培訓費用，便毋須保留任何培訓證據"],answer:0,tip:"正確答案：A（1、2及3）。付款紀錄不能代替課程內容、參與人員及培訓落實證據。參考《打擊洗錢指引》第9章。"},
      {id:24,module:5,variant:"official-long",stem:"獨立檢測人員發現多個分店重複出現客戶資料缺漏。管理層要求檢測人員只報告問題數量，不分析成因，也不跟進整改。就獨立檢測安排，下列哪幾項描述正確？",items:["檢測應評估AML/CFT制度是否足夠及有效運作","檢測結果及重大缺失應向適當管理層匯報","應跟進整改，並在適當情況下驗證改善措施是否有效","獨立檢測只須統計問題數量，不應考慮制度缺失及跟進"],answer:0,tip:"正確答案：A（1、2及3）。獨立檢測不只是統計問題，亦應評估制度有效性、向管理層匯報及跟進整改。參考《打擊洗錢指引》第3及8章。"},
      {id:25,module:5,variant:"official-long",stem:"某公司提名一名前線職員參加MSO能力評核，並認為該職員通過後即可滿足公司高級管理層的評核要求。就能力評核的對象及作用，下列哪幾項描述正確？",items:["能力評核旨在確保相關高級管理層具備基本AML/CFT知識","應考人士須符合能力評核須知所列的身份及資格條件","個別員工通過考試不代表公司已自動符合全部發牌及持續合規要求","任何員工通過考試均可自動取代公司適用的高級管理層評核要求"],answer:0,tip:"正確答案：A（1、2及3）。能力評核對象及作用須按能力評核須知理解；個別員工合格不能取代公司的全部監管責任。"},
      {id:26,module:6,variant:"official-long",stem:"某長期客戶近期的交易目的、收款對象及金額模式均明顯偏離其既有客戶資料。職員認為客戶已完成開戶時的CDD，因此無須再作查詢。就持續監察及更新客戶資料，下列哪幾項描述正確？",items:["應持續監察交易，以判斷交易是否符合機構對客戶的認知","出現重大資料不一致時，應按風險考慮進一步查詢及更新CDD資料","持續監察不應只限於開戶時的一次性檢查","客戶已是長期客戶，因此其交易可永久豁免持續監察"],answer:0,tip:"正確答案：A（1、2及3）。持續監察是CDD的重要部分；長期客戶身份不能取代對交易與客戶背景是否相符的持續評估。參考《打擊洗錢指引》第5章。"},
      {id:27,module:6,variant:"official-long",stem:"某客戶被識別為政治人物（PEP），並擬與MSO建立業務關係。前線職員認為所有PEP均必須自動拒絕，另一職員則認為只要客戶是本地人士便可完全豁免加強審查。就PEP風險處理，下列哪幾項描述正確？",items:["應按適用指引考慮PEP身份及其所涉風險","在適用的高風險情況下，應採取加強盡職審查措施","可按要求採取合理措施確立客戶或實益擁有人的財富來源及資金來源","PEP身份在任何情況下均代表必須拒絕所有交易，毋須作風險評估"],answer:0,tip:"正確答案：A（1、2及3）。PEP身份須按適用規定及風險採取措施，並非一概自動拒絕，也不能因本地身份便自動豁免。參考《打擊洗錢指引》第5章。"},
      {id:28,module:6,variant:"official-long",stem:"某MSO的篩查系統發現客戶姓名與制裁名單中的姓名相似，但出生日期及其他身份資料尚未核實。經辦員工認為相似姓名不可能是真正命中，遂直接刪除警示。就潛在匹配的處理，下列哪幾項描述正確？",items:["應按程序及時核實潛在匹配的身份及相關資料","應按內部升級程序處理真實或疑似命中","應保存篩查結果、核實過程及處理紀錄","經辦員工可在未核實及未留紀錄的情況下自行忽略警示"],answer:0,tip:"正確答案：A（1、2及3）。相似姓名不等於已確認命中，但亦不能未經核實便忽略；須依程序核實、升級及保存紀錄。參考《打擊洗錢指引》第6章。"},
      {id:29,module:6,variant:"official-long",stem:"員工懷疑客戶交易涉及洗錢，已向MLRO提交內部報告。客戶其後詢問機構是否已向當局舉報，前線員工打算為維持客戶關係而透露內部處理情況。就可疑交易報告及防止通風報訊，下列哪幾項描述正確？",items:["機構須採取措施防止向客戶作出通風報訊","員工應依內部程序向MLRO報告懷疑","是否向JFIU提交可疑交易報告，應由負責職能按程序考慮","為維持客戶關係，員工可向客戶披露已提交或擬提交的報告"],answer:0,tip:"正確答案：A（1、2及3）。向客戶披露可疑交易報告或相關處理情況可能構成通風報訊。參考《打擊洗錢指引》第7章及JFIU講座。"},
      {id:30,module:6,variant:"official-long",stem:"某MSO員工認為只有在確認客戶已犯罪後，才需要向MLRO提交內部報告；另一員工則認為JFIU會親自調查所有可疑交易。就懷疑門檻及JFIU職能，下列哪幾項描述正確？",items:["內部報告不應以已確認犯罪或取得定罪證據為前提","員工應在產生相關懷疑時按內部程序報告","JFIU負責接收、分析及儲存可疑交易報告，並按機制轉交適當調查小組","JFIU本身是負責親自調查所有洗錢案件的調查單位"],answer:0,tip:"正確答案：A（1、2及3）。JFIU並非調查單位；其職能包括接收、分析及儲存報告，並轉交適當調查小組。參考2025年JFIU Seminar及《打擊洗錢指引》第7章。"},
      {id:31,module:7,variant:"official-long",stem:"某持牌人準備遞交定期申報表，財務部門仍沿用舊有季度紙本申報流程，並計劃以郵寄方式提交。就2025年定期申報安排調整，下列哪幾項描述正確？",items:["定期申報安排自2025年6月30日起調整為每半年一次","申報表須按新安排經MSO牌照系統電子服務遞交","海關不再接受紙本定期申報表作為新安排下的遞交方式","申報資料包括匯款交易涉及的司法管轄區及所用交付渠道等指定資料"],answer:4,tip:"正確答案：E（以上皆是）。2025年5月30日海關通函說明半年申報、電子遞交、不再接受紙本及新增申報資料要求。應按通函及牌照系統的最新指定格式辦理。"},
      {id:32,module:7,variant:"official-long",stem:"某持牌人在一個申報期內沒有進行任何交易，因此管理層決定不查閱MSO牌照系統，也不遞交該期定期申報表。管理層認為沒有交易便必然沒有申報責任。就定期申報責任，下列哪幾項描述正確？",items:["持牌人須按關長指定的格式及方式處理適用的定期申報","不能單憑當期沒有交易便自行假設可豁免申報","未按時遞交定期申報表可導致牌照被暫時吊銷及／或撤銷","定期申報只在申請續牌時才需要處理"],answer:0,tip:"正確答案：A（1、2及3）。定期申報屬持續監管責任，不能自行假設無交易便豁免；須依關長指定要求及時處理。參考2025年5月30日海關通函及官方參考試題。"},
      {id:33,module:7,variant:"official-long",stem:"海關進行例行合規視察時，要求進入持牌人的業務處所，並抽查客戶及交易紀錄。持牌人以商業機密為由拒絕提供任何資料。就合規視察及紀錄備存，下列哪幾項描述正確？",items:["《打擊洗錢條例》第9條下設有例行合規視察安排","視察可涉及進入業務處所及查閱、複製或複印規定須備存的客戶或交易紀錄","持牌人應妥善保存紀錄，以便履行適用監管要求","只要紀錄涉及商業機密，持牌人便可一概拒絕監管查閱"],answer:0,tip:"正確答案：A（1、2及3）。2026年3月24日合規職能講座說明例行合規視察可進入業務處所及抽查指明紀錄；商業機密並非一概拒絕法定監管檢查的理由。"},
      {id:34,module:7,variant:"official-long",stem:"海關考慮是否就持牌人的違規行為施加罰款。調查顯示違規持續數月並重複發生，持牌人曾試圖隱瞞，事件亦可能損害客戶利益。就罰款評估因素，下列哪幾項描述正確？",items:["違規行為的性質、嚴重性及影響可納入考慮","違規行為持續時間及發生頻密程度可納入考慮","行為屬蓄意、罔顧後果或疏忽，以及有否隱瞞，均可能相關","只要持牌人規模較小，便必然不會被施加罰款"],answer:0,tip:"正確答案：A（1、2及3）。《施加罰款紀律行動指引》列出違規性質、嚴重性、影響、持續時間、頻密程度、行為性質及隱瞞等因素；機構規模不構成自動豁免。"},
      {id:35,module:7,variant:"official-long",stem:"某MSO通過能力評核後，管理層宣布公司已全面符合所有監管要求，因此停止更新政策、培訓及交易監察。管理層認為能力評核合格已足以取代其後的合規工作。就能力評核及持續合規責任，下列哪幾項描述正確？",items:["通過能力評核不代表自動符合全部發牌條件","持牌人仍須持續遵守適用法例、牌照條件及監管指引","機構應持續進行適當培訓、監察及保存合規證據","通過考試後即可永久豁免後續合規責任"],answer:0,tip:"正確答案：A（1、2及3）。能力評核旨在確保相關高級管理層具備基本AML/CFT知識，並非持續合規義務的替代品。參考能力評核須知及《打擊洗錢指引》。"}
    ];

    const PAPERS = {
      1: { name: "模拟卷一", storage: "mso_exam_v1_orange", questions: PAPER1 },
      2: { name: "模拟卷二", storage: "mso_exam_v2_orange", questions: PAPER2 },
      3: { name: "模拟卷三", storage: "mso_exam_v3_orange", questions: PAPER3 },
      4: { name: "模拟卷四（难）", storage: "mso_exam_v4_orange", questions: PAPER4 },
      5: { name: "模拟卷五（官方标准）", storage: "mso_exam_v5_orange", questions: PAPER5 },
      6: { name: "模拟卷六（情境综合）", storage: "mso_exam_v6_orange", questions: PAPER6 },
      7: { name: "模拟卷七（高难度综合）", storage: "mso_exam_v7_orange", questions: PAPER7 },
      8: { name: "模拟卷八（官方长题干组合题）", storage: "mso_exam_v8_orange", questions: PAPER8 },
      9: { name: "模拟卷九（牌照法规与监管实务）", storage: "mso_exam_v9_orange", questions: PAPER9 },
      10: { name: "模拟卷十（CDD与风险监控进阶）", storage: "mso_exam_v10_orange", questions: PAPER10 },
    };

    let paperId = Number(localStorage.getItem("mso_exam_active_paper") || "5");
    if (!Object.prototype.hasOwnProperty.call(PAPERS, paperId)) paperId = 5;

    function questions() { return PAPERS[paperId].questions; }
    function storageKey() { return PAPERS[paperId].storage; }

    function defaultState() {
      return {
        answers: Object.fromEntries(questions().map(q => [String(q.id), null])),
        submitted: false,
        showTips: false,
        onlyWrong: false,
        onlyBlank: false,
        filter: 0,
        wrongBook: [],
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(storageKey());
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return {
          answers: { ...Object.fromEntries(questions().map(q => [String(q.id), null])), ...(parsed.answers || {}) },
          submitted: !!parsed.submitted,
          showTips: !!parsed.showTips,
          onlyWrong: !!parsed.onlyWrong,
          onlyBlank: !!parsed.onlyBlank,
          filter: parsed.filter || 0,
          wrongBook: Array.isArray(parsed.wrongBook) ? parsed.wrongBook : [],
        };
      } catch {
        return defaultState();
      }
    }

    let state = loadState();

    function saveState(showToast = true) {
      localStorage.setItem(storageKey(), JSON.stringify(state));
      localStorage.setItem("mso_exam_active_paper", String(paperId));
      if (window.QsortCloud) window.QsortCloud.queueSave(paperId, state);
      if (showToast) {
        const t = document.getElementById("toast");
        t.classList.add("show");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => t.classList.remove("show"), 900);
      }
      updateHeader();
    }

    function choicesOf(q) {
      return q.variant === "stages" ? STAGES : (q.variant === "official-long" ? LONG_STD : STD);
    }

    function answeredCount() {
      return questions().filter(q => state.answers[String(q.id)] != null).length;
    }

    function moduleStats() {
      return [1,2,3,4,5,6,7].map(mod => {
        const qs = questions().filter(q => q.module === mod);
        const wrong = qs.filter(q => state.answers[String(q.id)] != null && state.answers[String(q.id)] !== q.answer).length;
        const correct = qs.filter(q => state.answers[String(q.id)] === q.answer).length;
        const blank = qs.filter(q => state.answers[String(q.id)] == null).length;
        return { mod, wrong, correct, blank, ok: wrong <= 2 && blank === 0 };
      });
    }

    function updateHeader() {
      document.getElementById("title").textContent = `MSO 能力评核 · ${PAPERS[paperId].name}`;
      document.getElementById("subtitle").textContent =
        "35題 · 7單元 · 官方組合題型 · 本地自動保存，登入後雲端同步";

      const n = answeredCount();
      document.getElementById("sAnswered").textContent = `${n}/35`;
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = n < 35 || state.submitted;
      document.getElementById("btnTips").hidden = !state.submitted;
      document.getElementById("btnWrong").hidden = !state.submitted;
      document.getElementById("btnContinue").hidden = state.submitted;
      document.getElementById("btnTips").textContent = state.showTips ? "隐藏解析" : "显示解析";
      document.getElementById("btnWrong").textContent = state.onlyWrong ? "显示全部题" : "只看错题";
      document.getElementById("btnWrongBook").textContent = "错题本（" + getAllWrongBook().length + "）";
      document.getElementById("btnWrongBook").classList.toggle("primary", wrongBookView);
      document.getElementById("btnContinue").textContent = state.onlyBlank ? "显示全部题" : "只看未答题";

      if (!state.submitted) {
        document.getElementById("sScore").textContent = "—";
        document.getElementById("sModules").textContent = "—";
        document.getElementById("sResult").textContent = n ? "续做中" : "作答中";
        document.getElementById("resultBox").hidden = true;
        document.getElementById("saveNote").textContent =
          n > 0
            ? `${PAPERS[paperId].name} 已自动保存 ${n}/35。关掉再打开可继续。`
            : `当前是${PAPERS[paperId].name}。进度保存在本机浏览器；各套试卷互不影响。`;
        return;
      }

      const total = questions().filter(q => state.answers[String(q.id)] === q.answer).length;
      const mods = moduleStats();
      const modulePass = mods.every(m => m.ok);
      const pass = total >= 25 && modulePass;
      document.getElementById("sScore").textContent = String(total);
      document.getElementById("sModules").textContent = modulePass ? "达标" : "未达标";
      document.getElementById("sResult").textContent = pass ? "合格" : "不合格";
      const box = document.getElementById("resultBox");
      box.hidden = false;
      box.innerHTML =
        `<b>${PAPERS[paperId].name} · 分单元成绩</b><br>` +
        mods.map(m =>
          `单元${m.mod}：对 ${m.correct}／错 ${m.wrong}` +
          (m.wrong > 2 ? `　← 本单元不及格` : "")
        ).join("<br>") +
        `<br><br><b>总评：${pass ? "合格" : "不合格"}</b>（须总分≥25，且每单元最多错2题）`;
    }

    function renderPaperTabs() {
      const el = document.getElementById("paperTabs");
      el.innerHTML = "";
      Object.keys(PAPERS).map(Number).forEach(id => {
        const b = document.createElement("button");
        b.className = "chip" + (paperId === id ? " on" : "");
        b.textContent = PAPERS[id].name;
        b.onclick = () => {
          paperId = id;
          state = loadState();
          saveState(false);
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        el.appendChild(b);
      });
    }

    function renderFilters() {
      const el = document.getElementById("filters");
      el.innerHTML = "";
      const all = document.createElement("button");
      all.textContent = "全部单元";
      all.className = "chip" + (state.filter === 0 ? " on" : "");
      all.onclick = () => { state.filter = 0; saveState(false); render(); };
      el.appendChild(all);
      for (let m = 1; m <= 7; m++) {
        const b = document.createElement("button");
        b.textContent = `单元${m}`;
        b.className = "chip" + (state.filter === m ? " on" : "");
        b.onclick = () => { state.filter = m; saveState(false); render(); };
        el.appendChild(b);
      }
    }


    let wrongBookView = false;
    function getAllWrongBook() {
      const all = [];
      Object.keys(PAPERS).map(Number).forEach(id => {
        try {
          const raw = localStorage.getItem(PAPERS[id].storage), saved = raw ? JSON.parse(raw) : null;
          (saved && Array.isArray(saved.wrongBook) ? saved.wrongBook : []).forEach(item => all.push(item));
        } catch {}
      });
      return all.sort((a,b) => String(b.addedAt || "").localeCompare(String(a.addedAt || "")));
    }
    function savePaperWrongBook(id, paperState) {
      localStorage.setItem(PAPERS[id].storage, JSON.stringify(paperState));
      if (window.QsortCloud) window.QsortCloud.queueSave(id, paperState);
      if (id === paperId) state = paperState;
    }
    function addWrongBookFromSubmission() {
      if (!Array.isArray(state.wrongBook)) state.wrongBook = [];
      questions().forEach(q => {
        const chosen = state.answers[String(q.id)];
        if (chosen == null || chosen === q.answer) return;
        const existing = state.wrongBook.find(item => item.questionId === q.id && item.paperId === paperId);
        if (existing) { existing.selectedAnswer = chosen; existing.attempts = Number(existing.attempts || 1) + 1; }
        else state.wrongBook.push({paperId:paperId,questionId:q.id,selectedAnswer:chosen,addedAt:new Date().toISOString(),attempts:1});
      });
    }
    function renderWrongBook() {
      const host = document.getElementById("paper"); host.innerHTML = "";
      const items = getAllWrongBook();
      const heading = document.createElement("h2"); heading.className = "mod-title";
      heading.textContent = "我的错题本 · " + items.length + " 题"; host.appendChild(heading);
      const intro = document.createElement("div"); intro.className = "note";
      intro.textContent = "交卷后答错的题目会自动收录。重新作答正确后，该题会自动从错题本移除；错题本会随登录账号同步。"; host.appendChild(intro);
      if (!items.length) { const empty=document.createElement("div"); empty.className="note ok"; empty.textContent="目前没有错题，继续保持！"; host.appendChild(empty); return; }
      items.forEach(item => {
        const source=PAPERS[item.paperId], q=source && source.questions.find(question=>question.id===item.questionId); if(!q)return;
        const card=document.createElement("section"); card.className="wrongbook-card";
        const meta=document.createElement("div"); meta.className="wrongbook-meta";
        meta.textContent=source.name+" · 第"+q.id+"题 · 单元"+q.module+" · 已练习"+(item.attempts||1)+"次"; card.appendChild(meta);
        const title=document.createElement("div"), strong=document.createElement("b"); strong.textContent=q.stem; title.appendChild(strong); card.appendChild(title);
        q.items.forEach((text,index)=>{const line=document.createElement("div");line.className="items";line.textContent=(index+1)+". "+text;card.appendChild(line);});
        choicesOf(q).forEach((label,index)=>{
          const choice=document.createElement("button");choice.type="button";choice.className="choice";choice.textContent=label;
          if(item.selectedAnswer===index)choice.classList.add("wrong");
          choice.onclick=()=>{
            const raw=localStorage.getItem(source.storage),saved=raw?JSON.parse(raw):{},list=Array.isArray(saved.wrongBook)?saved.wrongBook:[];
            const target=list.find(entry=>entry.paperId===item.paperId&&entry.questionId===item.questionId);if(!target)return;
            if(index===q.answer){saved.wrongBook=list.filter(entry=>!(entry.paperId===item.paperId&&entry.questionId===item.questionId));savePaperWrongBook(item.paperId,saved);showToastMessage("答对了，已从错题本移除");}
            else{target.selectedAnswer=index;target.attempts=Number(target.attempts||1)+1;target.lastAttemptAt=new Date().toISOString();savePaperWrongBook(item.paperId,saved);showToastMessage("再想一想，答案还不正确");}
            render();
          };card.appendChild(choice);
        });
        const answer=document.createElement("div");answer.className="wrongbook-answer";
        answer.textContent="正确答案："+choicesOf(q)[q.answer]+"　解析："+(q.tip||"暂无解析");card.appendChild(answer);
        const remove=document.createElement("button");remove.type="button";remove.textContent="从错题本移除";remove.style.marginTop="10px";
        remove.onclick=()=>{const raw=localStorage.getItem(source.storage),saved=raw?JSON.parse(raw):{};saved.wrongBook=(Array.isArray(saved.wrongBook)?saved.wrongBook:[]).filter(entry=>!(entry.paperId===item.paperId&&entry.questionId===item.questionId));savePaperWrongBook(item.paperId,saved);render();};
        card.appendChild(remove);host.appendChild(card);
      });
    }
    function showToastMessage(message) {
      const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");
      clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>toast.classList.remove("show"),1400);
    }

    function visibleQuestions() {
      let list = state.filter === 0 ? questions() : questions().filter(q => q.module === state.filter);
      if (state.submitted && state.onlyWrong) list = list.filter(q => state.answers[String(q.id)] !== q.answer);
      if (!state.submitted && state.onlyBlank) list = list.filter(q => state.answers[String(q.id)] == null);
      return list;
    }

    function render() {
      renderPaperTabs();
      renderFilters();
      updateHeader();
      const paper = document.getElementById("paper");
      if (wrongBookView) { renderWrongBook(); return; }
      paper.innerHTML = "";
      const list = visibleQuestions();
      let lastMod = null;
      list.forEach(q => {
        if (q.module !== lastMod) {
          lastMod = q.module;
          const h = document.createElement("div");
          h.className = "mod-title";
          h.textContent = MODULES[q.module - 1];
          paper.appendChild(h);
        }
        const selected = state.answers[String(q.id)];
        const card = document.createElement("div");
        card.className = "q";
        const head = document.createElement("div");
        head.className = "q-head";
        const title = document.createElement("div");
        title.innerHTML = `<b>${q.id}. ${q.stem}</b>`;
        const pill = document.createElement("span");
        pill.className = "pill";
        if (state.submitted && selected != null) {
          const ok = selected === q.answer;
          pill.className = "pill " + (ok ? "ok" : "bad");
          pill.textContent = ok ? "正确" : `答案 ${KEYS[q.answer]}`;
        } else if (selected != null) {
          pill.className = "pill saved";
          pill.textContent = "已保存";
        } else {
          pill.textContent = `第${q.id}题`;
        }
        head.appendChild(title);
        head.appendChild(pill);
        card.appendChild(head);

        const items = document.createElement("div");
        items.className = "items";
        items.innerHTML = q.items.map((it, i) => `${i + 1}. ${it}`).join("<br>");
        card.appendChild(items);

        choicesOf(q).forEach((label, idx) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.type = "button";
          btn.textContent = label;
          if (selected === idx) btn.classList.add("active");
          if (state.submitted) {
            if (idx === q.answer) btn.classList.add("correct");
            if (selected === idx && idx !== q.answer) btn.classList.add("wrong");
          } else {
            btn.onclick = () => {
              state.answers[String(q.id)] = idx;
              saveState(true);
              render();
            };
          }
          card.appendChild(btn);
        });

        if (state.submitted && state.showTips) {
          const tip = document.createElement("div");
          tip.className = "tip";
          tip.textContent = "解析：" + q.tip;
          card.appendChild(tip);
        }
        paper.appendChild(card);
      });
    }

    document.getElementById("btnWrongBook").onclick = () => { wrongBookView = !wrongBookView; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    document.getElementById("btnSubmit").onclick = () => {
      if (answeredCount() < 35) return;
      state.submitted = true;
      state.onlyBlank = false;
      addWrongBookFromSubmission();
      state.showTips = true;
      saveState(false);
      if (window.QsortCloud) window.QsortCloud.recordSubmission(paperId, state);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    document.getElementById("btnTips").onclick = () => {
      state.showTips = !state.showTips;
      saveState(false);
      render();
    };
    document.getElementById("btnWrong").onclick = () => {
      state.onlyWrong = !state.onlyWrong;
      saveState(false);
      render();
    };
    document.getElementById("btnContinue").onclick = () => {
      state.onlyBlank = !state.onlyBlank;
      saveState(false);
      render();
    };
    document.getElementById("btnReset").onclick = () => {
      if (!confirm(`确认清空「${PAPERS[paperId].name}」全部进度并重做？`)) return;
      const retainedWrongBook = Array.isArray(state.wrongBook) ? state.wrongBook : [];
      state = defaultState();
      state.wrongBook = retainedWrongBook;
      saveState(false);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    render();
    if (window.QsortCloud) window.QsortCloud.init({
      storageKey: (id) => PAPERS[id].storage,
      getActivePaper: () => paperId,
      questions: (id) => PAPERS[id].questions,
      paperName: (id) => PAPERS[id].name,
      applyState: (id, cloudState) => {
        if (PAPERS[id] && cloudState) localStorage.setItem(PAPERS[id].storage, JSON.stringify(cloudState));
        else if (PAPERS[id]) localStorage.removeItem(PAPERS[id].storage);
        if (id === paperId) { state = loadState(); render(); }
      }
    });
  </script>
</body>
</html>
