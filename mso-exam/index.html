<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MSO 能力评核模拟试卷</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #2a2f3a;
      --accent: #4c8bf5;
      --ok: #3dd68c;
      --bad: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 80px; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
    .bar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15,17,21,.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 10px 0 12px;
      margin: 0 -14px 14px;
      padding-left: 14px; padding-right: 14px;
    }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
    .stat {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px;
    }
    .stat b { display: block; font-size: 1.05rem; }
    .stat span { color: var(--muted); font-size: 0.75rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #paperTabs { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    #paperTabs .chip { flex: 0 0 auto; min-width: 38px; padding: 7px 11px; }
    button, .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .chip.on { border-color: var(--accent); color: var(--accent); }
    .note {
      border: 1px solid var(--line);
      background: #151922;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }
    .note.ok { border-color: #2a5a40; }
    .note.warn { border-color: #5a4a20; }
    .mod-title { margin: 22px 0 10px; font-size: 1.05rem; }
    .q {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .q-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
    .pill {
      flex: 0 0 auto;
      font-size: 0.75rem;
      border-radius: 999px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .pill.saved { color: var(--accent); border-color: #35598f; }
    .pill.ok { color: var(--ok); border-color: #2a5a40; }
    .pill.bad { color: var(--bad); border-color: #5a3038; }
    .items { color: var(--muted); font-size: 0.92rem; margin: 8px 0 10px; }
    .choice {
      display: block; width: 100%; text-align: left;
      margin: 6px 0; padding: 10px 12px;
      border-radius: 10px; border: 1px solid var(--line);
      background: #12151c; color: var(--text);
    }
    .choice.active { border-color: var(--accent); background: #182235; }
    .choice.correct { border-color: var(--ok); background: #14241c; }
    .choice.wrong { border-color: var(--bad); }
    .tip { margin-top: 8px; color: var(--muted); font-size: 0.86rem; }
    .toast {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: #22304a; color: #fff; padding: 8px 14px; border-radius: 999px;
      font-size: 0.85rem; opacity: 0; pointer-events: none; transition: .2s;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
    .cloud-panel { border: 1px solid var(--line); background: #151922; border-radius: 12px; padding: 10px; margin: 8px 0 12px; }
    .cloud-panel input { width: 100%; margin: 5px 0; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0f1115; color: var(--text); }
    .cloud-status { color: var(--muted); font-size: .82rem; margin: 5px 0; }
    .cloud-status.ok { color: var(--ok); } .cloud-status.error { color: var(--bad); } .cloud-status.warn { color: #e5bd63; }
    .history-row { display:flex; justify-content:space-between; gap:10px; border-top:1px solid var(--line); padding:7px 0; font-size:.82rem; }
    .history-row small { display:block; color:var(--muted); } .passed { color:var(--ok); white-space:nowrap; } .failed { color:var(--bad); white-space:nowrap; }
    .muted { color: var(--muted); }
    .wrongbook-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
    .wrongbook-meta { color:var(--muted); font-size:.8rem; margin-bottom:8px; }
    .wrongbook-answer { margin-top:9px; color:var(--ok); font-size:.88rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <h1 id="title">MSO 能力评核模拟试卷</h1>
      <div class="sub" id="subtitle">35题 · 7单元 · 官方组合题型 · 进度自动保存在本机浏览器</div>
      <section class="cloud-panel" aria-label="云端账号与同步">
        <b>云端账号 / 跨设备同步</b>
        <div id="cloudStatus" class="cloud-status">正在检查云端配置…</div>
        <div id="cloudAuthForm">
          <input id="cloudEmail" type="email" autocomplete="email" placeholder="邮箱地址" />
          <input id="cloudPassword" type="password" autocomplete="current-password" placeholder="密码（至少8位）" />
          <div class="actions"><button class="primary" id="cloudLogin" type="button">登录</button><button id="cloudSignup" type="button">注册新账号</button></div>
        </div>
        <div id="cloudSignedIn" hidden>
          <div class="actions" style="align-items:center"><span id="cloudUser"></span><button id="cloudLogout" type="button">退出登录</button><button id="cloudRefreshHistory" type="button">刷新历史</button></div>
          <div id="cloudHistory" style="margin-top:8px"></div>
        </div>
      </section>
      <div class="actions" id="paperTabs" style="margin-bottom:10px"></div>
      <div class="stats">
        <div class="stat"><b id="sAnswered">0/35</b><span>已作答</span></div>
        <div class="stat"><b id="sScore">—</b><span>总分</span></div>
        <div class="stat"><b id="sModules">—</b><span>单元门槛</span></div>
        <div class="stat"><b id="sResult">作答中</b><span>总评</span></div>
      </div>
      <div class="actions" id="filters"></div>
      <div class="actions" style="margin-top:8px">
        <button class="primary" id="btnSubmit" disabled>交卷并计分</button>
        <button id="btnTips" hidden>显示解析</button>
        <button id="btnWrongBook" type="button">错题本</button>
        <button id="btnWrong" hidden>只看错题</button>
        <button id="btnContinue">只看未答题</button>
        <button id="btnReset">清空重做…</button>
      </div>
    </div>

    <div class="note ok" id="saveNote">进度会自动保存到本机浏览器。关掉页面再打开，可继续做。</div>
    <div class="note warn" id="resultBox" hidden></div>
    <div id="paper"></div>
  </div>
  <div class="toast" id="toast">已保存</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./cloud-sync.js"></script>
  <script>
    const STD = ["a) 1、2及3", "b) 1、2及4", "c) 2、3及4", "d) 1、3及4", "e) 以上皆是"];
    const STAGES = ["a) 1、2及3", "b) 2、3及4", "c) 1、3及4", "d) 1、2及5", "e) 3、4及5"];
    const KEYS = ["A", "B", "C", "D", "E"];
    const LONG_STD = ["A) 1、2及3", "B) 1、3及4", "C) 2、3及4", "D) 1、2及4", "E) 以上皆是"];
    const MODULES = [
      "单元一　打击洗钱及恐怖分子资金筹集与打击扩散资金筹集的常识",
      "单元二　《打击洗钱条例》第1至7部",
      "单元三　《打击洗钱条例》的附表",
      "单元四　海关颁布的指引",
      "单元五　系统及管控措施(i)　机构层面的管治及策略",
      "单元六　系统及管控措施(ii)　打击洗钱及恐怖分子资金筹集的管控范畴",
      "单元七　系统及管控措施(iii)　证明符合规定及监察合规水平",
    ];

    const PAPER1 = [
      {"id":1,"module":1,"variant":"official-long","stem":"一名职员在培训中把洗钱理解成“必须先证明全部款项来自香港境内的罪行，而且必须由原犯罪者本人处理”。培训师要求大家结合混合款项、间接收益及境外行为重新判断。以下哪些陈述正确？","items":["有关财产可以只在部分价值上代表犯罪收益","间接代表可公诉罪行收益的财产也可落入定义范围","境外作为如在香港发生即属可公诉罪行，其收益也可涉及该定义","只有原犯罪者亲自处理财产才可能构成洗钱"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，混合资金中有合法成分并不会排除其余部分。②正确，收益经转移或转换后仍可能间接代表原收益。③正确，比较的是该作为若发生在香港的法律性质。④错误，定义关注行为及财产性质，没有限定处理者必须是原犯罪者。依据：参考卷 D1、E1；第615章附表1第1部第1条。"},
      {"id":2,"module":1,"variant":"official-long","stem":"某客户以合法工资作为一笔款项的来源。培训人员要求员工区分资金来源是否合法、拟作何种用途，以及为人员筹集财产时对其身份的认识。以下哪些陈述正确？","items":["款项未被实际用于恐怖主义行为前，筹集行为一律与该定义无关","拟将财产一部分用于恐怖主义行为的意图具有相关性","明知或罔顾某人是否为恐怖分子而为其利益筹集财产，也可能涉及该定义","合法来源的款项也可能涉及恐怖分子资金筹集"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，筹集行为与财产最终是否已经使用是不同问题。②正确，意图可涉及全部或部分财产。③正确，审查时亦须留意为相关人士利益筹集财产的情形。④正确，合法来源并不能排除相关意图或其他法定情形。依据：参考卷 E2；第615章附表1第1部第1条。"},
      {"id":3,"module":1,"variant":"official-long","stem":"公司把法例索引交给新任合规人员，并要求分别标注发牌及尽职审查制度、反恐措施、犯罪得益处理及联合国制裁的法律框架。以下哪些分类正确？","items":["以《货币兑换商条例》第34章作为现行MSO发牌制度的主要依据","第615章涵盖MSO发牌及适用的尽职审查和备存记录制度","第575章属于香港落实反恐措施的相关法例","第455章与处理犯罪得益相关，联合国制裁另有相应条例及规例"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，现行MSO发牌应查阅第615章。②正确，发牌及附表2责任均可在第615章查找。③正确，第575章的范畴包括反恐措施。④正确，犯罪得益与金融制裁各有法律依据。依据：参考卷 D3、E3、E5；第615、575、455章。"},
      {"id":4,"module":1,"variant":"official-long","stem":"管理层收到一份关于某司法管辖区反洗钱制度的评核摘要，其中有人把财务行动特别组织的作用理解成直接封锁地区并执行香港法例。以下哪些陈述正确？","items":["由该组织直接向香港持牌人施加牌照纪律处分","成员之间的经验交流属于其工作范畴","该组织制定国际标准并推动有效实施","该组织可通过评核检视司法管辖区的执行情况"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，香港持牌人的发牌及纪律监管由相关本地当局负责。②正确，地区间交流有助落实国际标准。③正确，标准制定是其职能。④正确，评核用于检视实施及合规情况。依据：参考卷 D5、E4。"},
      {"id":5,"module":1,"variant":"official-long","stem":"一间原本只做本地兑换的经营者拟上线汇款平台，并经海外代理接触新客户。董事要求风险报告列明哪些因素应独立评估，以及评估结果如何体现在资源分配中。以下哪些陈述正确？","items":["应考虑客户所在的司法管辖区","应评估海外代理及交易对手网络的使用程度","新科技及交付渠道应纳入评估","应把评估结果用于调整与风险相称的管控"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，地域可影响业务面临的风险。②正确，代理及对手网络是业务模式的一部分。③正确，线上交付带来与柜台可能不同的风险。④正确，评估的结果应落实到资源及措施。依据：参考卷 E6、E17；MSO/13 风险评估及缓解讲座。"},
      {"id":6,"module":2,"variant":"official-long","stem":"持牌人已签署新分店租约，同时原分店继续营业。装修完成后，区域经理拟以现有牌照先在新址试业两日，再补交文件。以下哪些陈述正确？","items":["原分店的牌照可自动覆盖新址的短期试业","应按规定以书面方式申请","新处所获准后，应在显眼位置按规定展示牌照正本","增加指明营业处所须事先取得关长批准"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，试业的称呼及现有租约均不会扩大牌照范围。②正确，书面申请是新增处所的程序。③正确，获准后的展示义务仍须落实。④正确，应在开展新处所业务前办妥批准。依据：参考卷 D9、D20、E9；第615章第5部；MSO/11 发牌规定。"},
      {"id":7,"module":2,"variant":"official-long","stem":"某公司的两名董事认为续牌只需处理费用，首次发牌时提交的适当人选资料从此无需再审，而另一董事正在整理书面申请资料。以下哪些陈述正确？","items":["续牌仍涉及适当人选资格的审核","关长有权就牌照施加条件","首次获牌后，续牌时不得再审查适当人选资格","续牌须按规定以书面方式申请"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，牌照期内的人选情况可能发生变化。②正确，续牌后仍须按适用条件经营。③错误，首次审查不会代替续牌审查。④正确，内部缴费记录不能代替书面申请。依据：参考卷 D7、E13；第615章第5部；MSO/11 发牌规定。"},
      {"id":8,"module":2,"variant":"official-long","stem":"公司决定月底停止经营金钱服务，前台拟先关门，随后等牌照自然届满。负责人需要确定停业日期如何具报，以及已经停止接单是否足以完成手续。以下哪些陈述正确？","items":["牌照临近届满并不自动免除交回义务","须以书面方式向关长具报停业意向及日期","须在停止经营后按规定交回牌照","停止接单或关闭网站可以代替书面具报"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，不能自行以余下有效期短为由保留牌照。②正确，书面具报须涵盖意向及日期。③正确，牌照交回与具报是不同手续。④错误，关闭销售渠道只反映业务安排。依据：参考卷 D8、E14；第615章第5部；MSO/11 发牌规定。"},
      {"id":9,"module":2,"variant":"official-long","stem":"审批团队正在整理拟任董事和企业申请人的资料。一名董事曾受境外专业团体纪律处分，企业则有财产被委任接管人。以下哪些事项可纳入适当人选判断？","items":["法团是否处于清盘或有接管人获委任","只要曾担任公职便必须判定不适当","境外专业团体作出的纪律处分","曾面对的刑事或纪律程序"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，法团的清盘及接管状况属于审查因素。②错误，担任公职本身不产生自动否决。③正确，审查可以顾及香港以外的相关处分。④正确，程序本身可以是考虑事项。依据：参考卷 D14、E7；MSO/6 适当人选准则。"},
      {"id":10,"module":2,"variant":"official-long","stem":"某持牌人在同一周更换存放账目及记录的本地地点和洗钱报告主任，且董事会正检视某董事是否仍属适当人选。以下哪些处理正确？","items":["按适用具报程序处理本地记录储存地点改变","按适用具报程序处理洗钱报告主任更换","持续留意董事的适当人选资格","同时核对及遵守关长施加的牌照条件"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，记录地点属于须核查的具报事项。②正确，洗钱报告主任变更不能只改内部名单。③正确，适当人选要求具有持续性。④正确，具报事项与牌照条件可以同时适用。依据：参考卷 D19、E11；第615章第5部；MSO/11 发牌规定。"},
      {"id":11,"module":3,"variant":"official-long","stem":"一名未与机构建立业务关系的客户，于上午及下午分别指示向同一收款人电传转账4,600港元及3,400港元，并说明两笔款项同属一项订单。以下哪些判断正确？","items":["若属有关连的电传转账，合计恰为8,000港元已达门槛","即使金额未达门槛，另有洗钱或恐怖分子资金筹集怀疑时仍须进行尽职审查","应考虑交易的时间、收款人及共同目的来判断是否有关连","每笔金额低于8,000港元便可排除尽职审查"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，“或以上”包括等于8,000港元。②正确，怀疑属于独立触发条件。③正确，判断关连应结合交易实际特征。④错误，有关连交易应合并判断适用门槛。依据：参考卷 E24、E29；第615章附表2第3条。"},
      {"id":12,"module":3,"variant":"official-long","stem":"合规人员整理柜台指引，需要分别处理新建业务关系、无业务关系的客户单次兑换，以及虽有既有客户档案但出现洗钱怀疑的情形。以下哪些说法正确？","items":["应在建立业务关系前执行适用的尽职审查","独立的非电传非经常交易一般金额门槛为120,000港元或等值","出现洗钱怀疑时，既有档案及金额偏低都不能单独排除审查责任","在建立新业务关系后才须首次考虑尽职审查"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，建立关系是独立的触发情形。②正确，该一般门槛须与8,000港元的电传转账门槛区分。③正确，怀疑是独立触发情形。④错误，时间点原则上在建立关系前。依据：参考卷 D15、E29；第615章附表2第3条。"},
      {"id":13,"module":3,"variant":"official-long","stem":"法团客户中，甲间接控制26%投票权，乙持有恰好25%已发行股本且无其他控制权，丙持股很少但行使对管理的最终控制权。董事会另提名丁负责对接。以下哪些陈述正确？","items":["丁因董事会指定对接而自动成为实益拥有人","丙可因对管理行使最终控制权而符合定义","甲符合投票权方面的实益拥有人条件","乙的持股比例单独看并未超过门槛"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，对接安排不证明最终拥有或控制。②正确，最终管理控制是独立判断路径。③正确，间接控制也须计入，26%超过门槛。④正确，恰好25%与超过25%不同。依据：参考卷 D11、E12；第615章附表2第1条。"},
      {"id":14,"module":3,"variant":"official-long","stem":"客户的授权代表到柜台提交业务指示。档案已有客户公司资料，代表出示了个人名片和政府签发的有效证件，并递交公司授权文件。以下哪些做法正确？","items":["已有客户公司的档案时，只需留存代表名片","把代表本人纳入识别及核实流程","参考可靠及独立来源核实其身份","核查该代表是否获客户授权"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，保存名片无法替代身份和权限核实。②正确，客户与代表是两个需要区分的对象。③正确，适当的政府资料可用于身份核实。④正确，身份与代表权限须分别核实。依据：参考卷 D16、E35；第615章附表2第2条。"},
      {"id":15,"module":3,"variant":"official-long","stem":"经营者考虑依赖合资格中介人执行部分客户尽职审查措施。合同拟约定证明文件由中介人持有，经营者在抽查时索取，并在终止服务时接收资料。以下哪些要求正确？","items":["经营者继续承担符合尽职审查规定的最终责任","应确保中介人设有可供提供有关资料的系统","应确保中介人在收到请求后于合理切实可行范围内尽快提供文件","应安排服务终止时将有关文件及记录交回"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，依赖中介不转移最终责任。②正确，可得性需要有系统支持。③正确，必要时不能等到年度审查才索取。④正确，退出安排有助维持记录的可得性。依据：参考卷 D12、E33；第615章附表2第18条。"},
      {"id":16,"module":4,"variant":"official-long","stem":"一名持有效外国护照的客户拟建立持续汇款关系。前台已录入姓名、国籍、证件号码及类别，但建议以职业代替出生日期，并以驾驶许可证作唯一核实依据。以下哪些处理正确？","items":["应收集该自然人客户的出生日期","有效护照可作独立及可靠的核实来源","录入职业即可取代出生日期","应保留证件类别及独特识别号码"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，出生日期属于基本识别资料。②正确，有效护照是题库所列来源之一。③错误，职业和出生日期用途不同。④正确，类别与号码配合可明确识别文件。依据：参考卷 D21、D35、E20、E26；MSO/3 客户尽职审查章节。"},
      {"id":17,"module":4,"variant":"official-long","stem":"一家信托经受托人提出长期汇款安排，架构中还有一家控股公司，日常指示可能由另一名得到授权的人士发出。以下哪些处理正确？","items":["仅以信托名称建档，完全无需考虑受托人是谁","受托人代表信托建立关系时，应把受托人视作客户","符合代表客户行事定义的人士须纳入识别及核实流程","应追查最终拥有或控制客户以及控制管理的人士"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，受托人的角色直接影响客户识别。②正确，受托人是代表安排建立关系的主体。③正确，第三方是否为代表须按实际角色判断。④正确，复杂架构不能只停在名义持有层。依据：参考卷 E32；MSO/3 客户尽职审查章节。"},
      {"id":18,"module":4,"variant":"official-long","stem":"持续监察发现法人客户的实益拥有人属外地政治人物。客户的交易量未变，分店经理主张沿用原有审批流程，并认为只有直接客户是政治人物才需要升级。以下哪些措施正确？","items":["采取合理措施确立财富及资金来源","只因政治人物是实益拥有人便可免除加强措施","对有关业务关系实施更严格的持续监察","为维持业务关系取得高级管理层批准"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，财富积累与具体资金的来源均需处理。②错误，实益拥有人的身份可触发加强审查。③正确，交易量暂未改变不代替加强监察。④正确，既有业务关系也可触发高级管理层批准要求。依据：参考卷 D13、E16；MSO/3 加强尽职审查章节。"},
      {"id":19,"module":4,"variant":"official-long","stem":"评估团队须将客户类别作为风险评估起点，并对个别业务的异常情况再作判断。以下哪些可以作为潜在较低风险的客户因素？","items":["在香港获授权向公众发售的集体投资计划","所有外地驻港领事一律视作低风险","香港政府机构或公共机构","证券市场上市且须遵守披露规定的法团"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，授权向公众发售是相关条件。②错误，领事身份不能一概视为低风险。③正确，公营性质是所列潜在因素之一。④正确，重点还包括持续披露规定。依据：参考卷 D27、E34；MSO/3 风险为本方法及客户尽职审查章节。"},
      {"id":20,"module":4,"variant":"official-long","stem":"某机构比较潜在客户，发现一家公司使用代名人股东，另一公司架构经多层空壳但未说明商业目的，第三名客户拟建立与其营运性质明显不符的业务关系。以下哪些陈述正确？","items":["代名人安排可能增加识别最终控制人的难度","欠缺明确合法商业目的的空壳架构值得关注","与通常经营情形明显不符的关系可视为风险信号","应结合具体事实调整措施，并记录风险判断理据"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，名义持有人与最终控制人可能不同。②正确，架构与商业目的应能相互解释。③正确，异常关系有必要进一步了解。④正确，风险信号是深入分析的起点。依据：参考卷 D26、D29、E31；MSO/13 风险评估及缓解讲座。"},
      {"id":21,"module":5,"variant":"official-long","stem":"高级管理层计划把合规主任和洗钱报告主任安排在缺乏查阅核心交易资料权限的岗位，并认为供应商的风险报告足以证明机构落实了内部制度。以下哪些判断正确？","items":["高级管理层负责推动落实有效制度及妥善管理已识别风险","两名主任只须拥有职位名称，能否及时取得资料并不重要","两名主任应具备适当资历、权力及反洗钱知识","应在切实可行范围内确保两名主任通常长驻香港"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，管理层负责监督制度实际运作。②错误，及时取得资料是履行职责的必要条件。③正确，权限与专业能力须与职位相称。④正确，通常长驻香港是资料列出的任职安排。依据：参考卷 D22、D23、E22；MSO/15 合规职能及法定责任讲座。"},
      {"id":22,"module":5,"variant":"official-long","stem":"内部检查发现，执行客户审查的团队也负责审阅自己处理的所有档案，审核结果仅统计交易量，新员工在入职前没有适当甄选。以下哪些改进正确？","items":["评估风险评估框架及合规职能是否有效","设置适当的员工甄选程序","以业务团队核对自己的档案作为唯一独立审核","设立独立的审核职能"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，检查重点应覆盖制度设计及执行成效。②正确，员工甄选是机构管控的一部分。③错误，自我检查无法代替独立评估。④正确，独立审核有助查出制度与执行的缺口。依据：参考卷 D22；MSO/3 机构层面的管治章节。"},
      {"id":23,"module":5,"variant":"official-long","stem":"一间机构重新分配合规主任及洗钱报告主任的职责，希望内部异常报告能送达适当人员，且报告决定留有记录。以下哪些分工正确？","items":["妥善保留内部审核及决定记录","由洗钱报告主任担任可疑交易报告的中央联络点","由洗钱报告主任审核内部披露并判断是否对外报告","由前线主管按客户贡献决定哪些报告不得送达洗钱报告主任"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，记录应支持日后复核及说明处理理据。②正确，报告的中央联络点属于洗钱报告主任职责。③正确，相关决定应综合掌握的资料。④错误，商业贡献不应阻断报告渠道。依据：参考卷 D23、E22、E23；MSO/15 合规职能及法定责任讲座。"},
      {"id":24,"module":5,"variant":"official-long","stem":"某经营者打算给新员工发一份旧版培训讲义，然后取消复修安排，并仅保存一次签到人数。以下哪些安排符合培训要求？","items":["保留谁受训、何时受训及培训类别等记录","培训记录至少保存三年","发出一份讲义后便可免除后续培训","根据岗位职责安排充分的初步及复修培训"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，这些信息能证明培训覆盖了哪些人员及职责。②正确，题库列明培训记录最低保存期限为三年。③错误，单次发放材料无法代替持续培训。④正确，复修使员工掌握最新要求及风险变化。依据：参考卷 D31、E18；MSO/7 持续专业培训指引。"},
      {"id":25,"module":5,"variant":"official-long","stem":"独立审核发现业务量翻倍后，原有授权层级和监察流程产生大量待处理个案。经营者准备重配人手及调整制度，以下哪些方面应纳入整改？","items":["根据业务规模及复杂性检查制度设计","重新评估业务活动所产生的风险","检视合规部门能否有效履行职能","根据已识别的风险重新分配监察资源"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，业务规模变化可影响管控能力。②正确，评估应反映实际业务。③正确，合规成效不能用制度是否存在衡量。④正确，资源须投向风险较高或控制较弱的环节。依据：参考卷 D22、D29、E17、E19；MSO/3 管治及风险为本方法章节。"},
      {"id":26,"module":6,"variant":"official-long","stem":"机构收到名单更新，同时准备执行一笔跨境电传转账。系统发现某公司实益拥有人的英文姓名与名单近似，但出生资料尚未核对。以下哪些处理正确？","items":["搜索结果只要名字相似就视作已经确认真实命中","跨境电传转账执行前应筛查相关各方","对可能命中者进一步核对以区分同名与真实命中","根据名单更新尽快筛查既有客户及其相关实益拥有人"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，需以进一步资料消除或确认疑点。②正确，跨境付款前筛查是独立环节。③正确，应综合核对身份资料后作判断。④正确，持续筛查应覆盖新增和更新指认。依据：参考卷 D4、D24；MSO/3 金融制裁及筛查章节。"},
      {"id":27,"module":6,"variant":"official-long","stem":"业务团队把客户突然增加的交易量解释成节日前的普遍现象，但系统显示付款地点和交易对手同时改变。以下哪些交易监察安排正确？","items":["考虑付款或收款地点及交易对手变化","按业务规模、服务性质及风险调整监控制度","只按照金额排序，地域及交易对手永远无需纳入","比较该客户既有活动及通常营业额"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，地域及对手属于相关交易特征。②正确，系统精密程度应因应实际风险和业务。③错误，单一金额无法反映模式变化。④正确，客户自己的基准有助识别偏离。依据：参考卷 D30、E19；MSO/3 持续监察章节。"},
      {"id":28,"module":6,"variant":"official-long","stem":"柜台在完成询问之前客户离开，款项未被接收。洗钱报告主任根据已掌握事实形成与犯罪得益有关的怀疑，但未能识别具体上游罪行。以下哪些陈述正确？","items":["没有完成交易不当然排除报告责任","无须先确定具体上游罪行才评估是否报告","必须等有关部门取得定罪证据才能作出报告","确立怀疑后须在切实可行范围内尽快报告"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，报告责任可涉及未完成的交易。②正确，怀疑的形成与查明具体上游罪行是不同问题。③错误，报告门槛不同于定罪门槛。④正确，处理速度应符合尽快报告要求。依据：参考卷 D17、E10；第455章第25A条；MSO/14 举报可疑交易讲座。"},
      {"id":29,"module":6,"variant":"official-long","stem":"前台发现交易异常，客户多次追问是否被报告。机构的内部制度同时要求保存判断、限制信息传播并及时移交案件。以下哪些做法正确？","items":["允许前台为安抚客户而披露已作出的报告","让内部报告及时送达洗钱报告主任","保存内部审核及有关报告的记录","避免透露可能损害调查的信息"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，客户追问并不豁免有关保密责任。②正确，报告流程不能无故延误。③正确，记录用于追溯识别及处理过程。④正确，应重点防止通风报讯。依据：参考卷 D25、D28、E23；第455章第25A条；MSO/14 举报可疑交易讲座。"},
      {"id":30,"module":6,"variant":"official-long","stem":"机构为未建立业务关系的新客户处理一笔独立的7,500港元电传转账。该笔款项来自汇款人在机构开立的账户，暂未发现关连交易或可疑情况。以下哪些陈述正确？","items":["应保留适用的汇款人姓名或名称","应保留适用的收款人姓名或名称","题述来源账户号码属于有关汇款资料","低于金额门槛仍须处理适用的电传转账资料义务"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，金额较小不当然免除转账资料义务。②正确，收款人姓名是题库列明的资料。③正确，本题已明确存在作为资金来源的账户。④正确，金额触发的尽职审查与转账资料要求承担不同作用。依据：参考卷 D33、E24、E29、E30；第615章附表2第3及第12条。"},
      {"id":31,"module":7,"variant":"official-long","stem":"档案主管打算把尽职审查文件从纸本档案迁移到电子系统，并要求分店经理区分合规的文件保存形式与储存柜的物理防护措施。以下哪些说法正确？","items":["可以采用微缩影片备存文件副本","可以采用电脑数据库备存文件副本","可以按规定保留文件正本","只保留上锁储物柜及档案编号便等同备存文件"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，微缩影片可用来保留副本。②正确，电脑数据库亦是允许的备存形式。③正确，正本属于合适的备存形式。④错误，存放设施不能替代应保存的文件本身。依据：参考卷 D6、E8；第615章附表2第20及第21条。"},
      {"id":32,"module":7,"variant":"official-long","stem":"客户审查档案里已有身份证件副本，持续监察期间又收到了支持业务解释的文件，并形成一份人工分析记录。负责人准备只保存最早取得的身份证明。以下哪些资料应纳入留档？","items":["已作分析的结果","仅留客户名片，以此代替后续取得的文件和分析结果","识别和核实客户身份取得的文件正本或副本","持续监察期间取得的相关支持文件及记录"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，分析结果有助说明采取或不采取行动的理由。②错误，名片不能替代这些监管记录。③正确，识别核实资料是尽职审查留档的一部分。④正确，持续监察留档应覆盖后续资料。依据：参考卷 D10、E21；第615章附表2第20条。"},
      {"id":33,"module":7,"variant":"official-long","stem":"某持牌人的整个申报期没有完成任何交易。财务部门准备直接跳过当期申报，并把已填写的旧版纸本报表留在办公室。以下哪些说法正确？","items":["应按关长指定的方式及格式递交","定期申报仅须与下一次续牌申请一并递交","未按规定递交可能产生牌照监管后果","无交易不能自行推定获豁免"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，填好内部文件并不等于递交。②错误，续牌与定期申报是不同程序。③正确，资料列明可能暂时吊销或撤销牌照。④正确，零交易亦须按适用安排处理。依据：参考卷 D18、D20、E28；MSO/9 定期申报通函。"},
      {"id":34,"module":7,"variant":"official-long","stem":"监管人员进行合规视察，要求抽查识别客户、核实身份和持牌人监察交易的文件。分店虽可找到部分纸本，但合规数据和审核记录分别存放在不同处所。以下哪些陈述正确？","items":["例行监管视察可以涉及进入业务处所","视察可以涉及查阅或复制按规定备存的记录","资料分散存放时仍须确保按规定可供查阅","凡属商业资料均可自动拒绝监管查阅"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，第9条提供例行视察相关权力。②正确，受规管记录是检查范围之一。③正确，分散保存不能成为无法提供记录的理由。④错误，商业性质本身不会产生概括豁免。依据：参考卷 D20、D22；第615章第9条；MSO/15 合规职能及法定责任讲座。"},
      {"id":35,"module":7,"variant":"official-long","stem":"合规团队发现同类缺失在多次抽查中重复出现，且涉及人员培训和交易监察。高级管理层要求在整改记录里同时反映问题持续多久、是否重复、有什么影响，以及将如何核查改进。以下哪些安排正确？","items":["记录问题的性质及潜在影响","核查问题的持续时间及发生频率","针对培训和监察缺口落实纠正措施","保留整改证据并复核措施是否有效"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，影响有助判断严重程度。②正确，持续及反复出现与单一事件不同。③正确，纠正措施应对应实际缺口。④正确，复核及留档用来证明措施落实并发挥作用。依据：参考卷 D19、D22、E18；MSO/4 纪律行动指引、MSO/15 合规职能及法定责任讲座。"}

      {"id":1,"module":1,"variant":"official-long","stem":"培训案例中，一笔涉嫌犯罪的款项先购入资产，再出售取得价款，最后与正常营业收入合并。评核人员要求判断哪些财产可纳入洗钱定义的分析。以下哪些陈述正确？","items":["有关行为可使犯罪收益看似并非犯罪收益","必须能识别原来使用的每一张钞票","出售资产所得可间接代表原犯罪收益","混合账户可以仅有部分价值代表该收益"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，掩饰收益性质是题述行为的重点。②错误，法例并不以追踪实物钞票为条件。③正确，收益可以改变形式。④正确，只代表部分价值也可涉及定义。依据：参考卷 D1、E1；第615章附表1第1部第1条。"},
      {"id":2,"module":1,"variant":"official-long","stem":"审核员比较两项转账：第一项源于合法募款但拟用于恐怖主义行为，第二项拟为恐怖分子的利益取得金融服务。以下哪些判断正确？","items":["为相关人士利益取得金融服务也可能落入定义","应分别考虑款项用途和服务对象","只要募款来源合法就可结束判断","拟将部分财产用于恐怖主义行为也要考虑"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，定义亦涉及相应金融服务。②正确，两项分别涉及用途及对象。③错误，合法来源无法排除相关用途。④正确，要求不局限于全部财产。依据：参考卷 D2、E2；第615章附表1第1部第1条。"},
      {"id":3,"module":1,"variant":"official-long","stem":"管理层收到一份国际反洗钱评核，拟在内训中说明评核机构、当地监管机构和持牌人的不同角色。以下哪些陈述正确？","items":["财务行动特别组织直接发出香港MSO牌照","该组织制定国际标准","该组织通过评核检视实施情况","香港持牌人的本地监管由香港相关当局负责"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，发牌是本地监管职能。②正确，制定国际标准是其职责。③正确，评核是监察合规的机制。④正确，国际评核不会取代本地监管。依据：参考卷 D5、E4。"},
      {"id":4,"module":1,"variant":"official-long","stem":"新员工把发牌、犯罪得益及反恐措施全部归入同一份法律索引。负责培训的合规人员要求重新为三个主题标明法源。以下哪些陈述正确？","items":["反恐措施可查阅第575章","第455章只规范牌照展示位置","处理犯罪得益可涉及第455章","金钱服务发牌制度可查阅第615章"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，第575章是反恐措施相关条例。②错误，牌照展示应查阅MSO发牌规定。③正确，第455章包含与犯罪得益有关的规定。④正确，第615章第5部涵盖MSO发牌。依据：参考卷 D3、E5；第615、575及455章。"},
      {"id":5,"module":1,"variant":"official-long","stem":"公司打算更新金融制裁制度，现有手册只有一份静态名单，缺少变动通知、可能命中复核及对相关限制的处理流程。以下哪些改进正确？","items":["考虑适用的特许权安排","维护和更新筛查机制","按适用规例核对指认对象及限制","明确命中个案的内部处理职责"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，特许权须依规核对。②正确，名单会变化。③正确，须依据适用指认及措施判断。④正确，职责明确有助及时处理。依据：参考卷 E3；MSO/16 打击恐怖分子资金筹集讲座。"},
      {"id":6,"module":2,"variant":"official-long","stem":"持牌人拟把新门店与办公室设在同一楼层，但新门店不属于现有牌照指明的处所。其运营人员以为附近的旧店已展示原牌照。以下哪些陈述正确？","items":["应向关长按规定提交书面申请","应在于新门店经营前取得批准","获批准后应按规定在新处所显眼位置展示正本","旧店位置相近便可使批准自动延伸"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，书面申请是新增处所程序。②正确，批准须先于经营。③正确，展示义务适用于指明处所。④错误，相邻不产生批准。依据：参考卷 D9、D20；第615章第5部；MSO/11 发牌规定。"},
      {"id":7,"module":2,"variant":"official-long","stem":"一名独资经营者准备续牌，期间曾被专业团体处分。他认为已经缴交费用，关长只能按旧牌照条件原样续发。以下哪些陈述正确？","items":["缴费可代替适当人选审核","适当人选资格仍可在续牌时被审核","关长可以就牌照施加条件","应按适用程序以书面方式办理续牌"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，缴费和审查是不同环节。②正确，首次获牌不终结后续审核。③正确，监管权限适用于续牌。④正确，书面程序仍适用。依据：参考卷 D7、E13；第615章第5部；MSO/11 发牌规定。"},
      {"id":8,"module":2,"variant":"official-long","stem":"董事会定于月底结束全部金钱服务，但后勤办公室仍会暂时处理客户查询。经理提出只发客户公告，不另行安排牌照手续。以下哪些陈述正确？","items":["具报中应说明停业日期","停止经营后仍须按规定交回牌照","客户停业公告可以代替向关长具报","应书面具报停业意向"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，日期属于具报内容。②正确，交回牌照是独立步骤。③错误，客户公告的对象及作用不同。④正确，须按法定方式具报。依据：参考卷 D8、E14；第615章第5部；MSO/11 发牌规定。"},
      {"id":9,"module":2,"variant":"official-long","stem":"申请资料涉及一名曾在海外受公开谴责的拟任人员，以及一家财产已被委任接管人的法团。审查组希望区分可考虑的因素与自动取消资格的说法。以下哪些陈述正确？","items":["境外监管机构的公开谴责可以考虑","法团财产的接管安排可以考虑","只要曾担任公职就必须拒绝申请","曾面对的刑事或纪律程序也可考虑"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，考虑范围可涵盖境外监管记录。②正确，接管属于财务及管治状况的一部分。③错误，曾任公职本身没有自动否决效果。④正确，程序记录可纳入整体判断。依据：参考卷 D14、E7；MSO/6 适当人选准则。"},
      {"id":10,"module":2,"variant":"official-long","stem":"公司刚更换合规主任及洗钱报告主任，同时搬迁存放账目的本地办公室。项目经理拟将所有事项列入同一份监管合规清单。以下哪些事项应核对？","items":["洗钱报告主任更换的具报要求","本地账目及记录储存地点变化","独立适用的牌照条件","合规主任更换的具报要求"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，该岗位属于相关变更项目。②正确，储存地点属于资料变更项目。③正确，通知变更并不能代替遵守条件。④正确，人员变动须核对具报程序。依据：参考卷 D19、E11；MSO/11 发牌规定。"},
      {"id":11,"module":3,"variant":"official-long","stem":"两个分店各收到同一人发出的4,100港元电传转账指示，转账均付给同一收款人。客户尚未建立业务关系，两笔款项用于支付同一张账单。以下哪些判断正确？","items":["应在执行达到门槛的有关连电传转账前实施适用审查","分店不同就必须逐笔独立计算","可结合收款人、时间和交易目的判断关连","如认定有关连应按8,200港元合计判断"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，合计达到8,000港元门槛。②错误，内部地点分开不切断客观关联。③正确，判断依赖实际交易联系。④正确，有关连金额应合计。依据：参考卷 E24、E29；第615章附表2第3条。"},
      {"id":12,"module":3,"variant":"official-long","stem":"前台同时收到首次开设长期业务关系的申请、一次低额独立兑换，以及一项原有识别资料真实性受到质疑的业务。以下哪些陈述正确？","items":["洗钱怀疑可以独立触发尽职审查","建立业务关系须在适用时间执行尽职审查","独立小额兑换须一律套用电传转账金额门槛","原识别资料的真实性出现疑问可触发尽职审查"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，无需等到金额达到门槛。②正确，新建关系本身为触发情形。③错误，交易类别决定适用门槛。④正确，应重新处理存在疑问的识别资料。依据：参考卷 D15、E29；第615章附表2第3条。"},
      {"id":13,"module":3,"variant":"official-long","stem":"一家法团的股东甲拥有24%股本和28%投票权，乙仅直接持有25%股本，丙没有登记持股但行使对公司管理的最终控制权。以下哪些陈述正确？","items":["甲可因投票权超过25%而符合定义","乙的持股比例单独看不超过门槛","丙可因最终管理控制而符合定义","甲的股本不到25%，因此必然无需识别"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，投票权是独立判断条件。②正确，恰好25%不等于超过25%。③正确，最终管理控制不要求登记持股。④错误，仍须分别考察投票权和控制权。依据：参考卷 D11、E12；第615章附表2第1条。"},
      {"id":14,"module":3,"variant":"official-long","stem":"公司客户派财务助理到分店发出汇款指示，助理出示政府证件，但与交易档案一同提交的授权证明已过期。以下哪些做法正确？","items":["因证件有效而直接视其有权发出指示","另行核查有效的客户授权","识别及核实助理的身份","采用适当可靠独立资料核实身份"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，身份有效不证明代理权。②正确，代表权限要单独核查。③正确，代表人是尽职审查对象。④正确，可靠政府来源可用于核实。依据：参考卷 D16、E35；第615章附表2第2条。"},
      {"id":15,"module":3,"variant":"official-long","stem":"一间持牌人拟依赖合资格中介人进行审查，后来更换中介，同时监管视察要求交出原客户核实记录。以下哪些安排应落实？","items":["终止服务时安排将文件记录交还","确认尽职审查最终责任仍由持牌人承担","已有适当的文件获取机制","收到要求后能尽快取得有关文件"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，退出安排保障记录持续可用。②正确，合资格并不转移最终责任。③正确，记录由第三方持有仍要可取。④正确，抽查可触发取用资料。依据：参考卷 D12、E33；第615章附表2第18条。"},
      {"id":16,"module":4,"variant":"official-long","stem":"个人客户首次办理账户登记，出示附照片的有效国民身份证。柜员在录入系统中遗漏证件类别及出生日期，认为职业及联系人足以补上空缺。以下哪些陈述正确？","items":["有效的附照片国民身份证可作为适当来源","出生日期属于基本识别资料","应记录证件类别与号码","联系人及职业可代替上述缺失资料"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，该证件在参考资料列举的来源之中。②正确，出生日期用于区分身份。③正确，号码应与证件类别配合。④错误，额外客户资料与基础识别字段有不同用途。依据：参考卷 D21、D35、E26；MSO/3 客户尽职审查章节。"},
      {"id":17,"module":4,"variant":"official-long","stem":"受托人代表信托与持牌人建立固定服务安排，另一名获授权者负责递交指示。合规经理拟只调查文件上列出的名义持有人。以下哪些做法正确？","items":["按适用规定识别及核实代表客户行事者","追查最终拥有及控制情况","考虑受托人作为客户的身份","只识别名义持有人即可结案"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，是否为代表人取决于实际权限。②正确，名义安排不能代替最终控制分析。③正确，受托人代表信托建立关系时应视为客户。④错误，复杂安排还须调查实际控制。依据：参考卷 E32；MSO/3 客户尽职审查章节。"},
      {"id":18,"module":4,"variant":"official-long","stem":"复核发现一位既有客户本人属于外地政治人物。原档案已有其国籍和职业，但未记录财富来源，并一直采用常规监察。以下哪些处理正确？","items":["执行更严格的持续监察","只要客户早于发现时间开户即可沿用原措施","就维持关系取得高级管理层批准","采取合理措施确立资金及财富来源"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，风险变化须反映在监察上。②错误，维持既有关系也要考虑适用措施。③正确，批准适用于维持关系。④正确，职业资料不直接说明两类来源。依据：参考卷 D13、E16；MSO/3 加强尽职审查章节。"},
      {"id":19,"module":4,"variant":"official-long","stem":"分析员在文件中同时发现代名人股东、缺乏可解释业务目的的空壳架构及在香港获授权向公众发售的集体投资计划。以下哪些判断正确？","items":["代名人结构可以是较高风险因素","无明确合法商业目的的空壳架构值得关注","获授权公售的集体投资计划本身应一律视为高风险","仍应结合实际情况确定评级"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，名义持有可能降低透明度。②正确，缺乏商业目的使风险疑点增加。③错误，题库把该类获授权计划列作潜在较低风险因素。④正确，因素不能取代个别判断。依据：参考卷 D26、E31；MSO/3 风险评估章节。"},
      {"id":20,"module":4,"variant":"official-long","stem":"董事会发现，客户大多来自本地，但主要产品经境外渠道提供，易被不同类型客户使用。董事会想以单一地理指标决定所有业务风险。以下哪些建议正确？","items":["评估产品与服务的性质","分析交付渠道及司法管辖区因素","采取与结果相称的措施","记录客户层面的风险因素"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，产品用途和性质影响被滥用的可能性。②正确，渠道与地域需分别分析。③正确，风险评估应落实为管控。④正确，客户特征会改变总体风险。依据：参考卷 D29、E6；MSO/13 风险评估及缓解讲座。"},
      {"id":21,"module":5,"variant":"official-long","stem":"一间小型MSO拟将合规负责人设置为没有监察资料访问权限的初级职员，并把管理层监督交给外部顾问。以下哪些安排正确？","items":["聘用外部顾问便可完全代替管理层监督","高级管理层应监督制度运作","负责人须具备相称的资历和权限","负责人应能及时取得相关资料"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，顾问只能提供支持。②正确，管治责任由管理层承担。③正确，职责需要实质权限及能力。④正确，资料取得速度影响履职。依据：参考卷 D23、E22；MSO/15 合规职能及法定责任讲座。"},
      {"id":22,"module":5,"variant":"official-long","stem":"一家MSO由单一柜台发展为多渠道经营，独立审核发现部分警示无人跟进，原监察系统也无法覆盖新产品。以下哪些安排正确？","items":["审核范围应检验合规职能成效","沿用旧系统并只统计交易总量足够","按服务和风险重新评估系统设计","保留审核和跟进证据"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，职能有效性是审核内容。②错误，交易总量不足以说明覆盖范围。③正确，系统须随业务及风险调整。④正确，证据支持整改复核。依据：参考卷 D22、E19；MSO/3 机构管治及持续监察章节。"},
      {"id":23,"module":5,"variant":"official-long","stem":"公司在运营部与合规部之间设立内部报告流程，业务主管提议把需不需要上报交给客户经理决定。以下哪些分工正确？","items":["洗钱报告主任是处理可疑报告的中央联络点","洗钱报告主任审核汇集的资料并决定是否对外报告","应保留内部审核记录","客户经理可按客户利润否决提交内部报告"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，该负责人是报告联络点。②正确，评估须结合可获得事实。③正确，留档便于追溯决定。④错误，利润不能作为阻断内部披露的理由。依据：参考卷 D25、E23；MSO/14 举报可疑交易讲座。"},
      {"id":24,"module":5,"variant":"official-long","stem":"监察人员从销售岗调到负责比较身份资料及风险警示的岗位。管理层希望记录后续培训的参与情况和版本，供检查时查阅。以下哪些陈述正确？","items":["只有以外部机构举办的课才可纳入培训","培训资料应随现行要求更新","培训应切合岗位责任","应记录受训人员、时间及种类"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，有效培训并非限于指定外部课程。②正确，旧版本有遗漏新规则的风险。③正确，新职能可能需要补充培训。④正确，这些信息支持证明培训覆盖。依据：参考卷 D31、E18；MSO/7 持续专业培训指引。"},
      {"id":25,"module":5,"variant":"official-long","stem":"独立审核发现开户审批的授权层级含糊，若干风险判断没有记录。管理层拟改善政策、执行、持续核查及人员安排。以下哪些选项属于适当措施？","items":["明确审批及升级的职责","按识别风险调整资源","保留足以说明判断的证据","评估整改后措施的有效性"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，明确分工减少遗漏。②正确，高风险业务需要相称资源。③正确，记录有助复核是否落实。④正确，整改结果需要验证。依据：参考卷 D22、D29；MSO/3 机构层面管治章节。"},
      {"id":26,"module":6,"variant":"official-long","stem":"名单更新时，一名既有客户使用曾登记的英文别名。公司正在执行跨境电传转账，收款人和其中一项指认同名。以下哪些处理正确？","items":["跨境转账前筛查相关各方","对同名结果做进一步核查","仅在客户首次登记时筛查便足够","在切实可行范围内尽快按名单更新筛查"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，交易前筛查是独立环节。②正确，同名还需要身份资料确认。③错误，名单与客户资料均可变化。④正确，更新可能改变命中情况。依据：参考卷 D4、D24；MSO/3 筛查章节。"},
      {"id":27,"module":6,"variant":"official-long","stem":"一名客户的交易总额与上月相同，但汇款改经另一个交付渠道，收款地区和付款对手同时改变。以下哪些判断正确？","items":["对手及收付款地点属于相关特征","应根据实际业务风险设定监察系统","应参考客户通常活动了解偏离","总额相同可以排除进一步监察"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，对手及地点可以影响风险。②正确，系统应符合风险及业务复杂程度。③正确，历史模式可作合理比较。④错误，金额相同不代表模式相同。依据：参考卷 D30、D32、E19；MSO/3 持续监察章节。"},
      {"id":28,"module":6,"variant":"official-long","stem":"客户在支付前取消交易，内部评估人员仍怀疑有关款项关联可公诉罪行收益，但未能确定具体罪行。以下哪些陈述正确？","items":["无须等待取得定罪证据","取消付款即消除适用报告责任","确立相关怀疑后应在切实可行范围内尽快报告","无须先确定上游罪行"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，报告标准不同于法院定罪标准。②错误，未成交不排除有关责任。③正确，时限从相关情况确立后判断。④正确，不必查明具体上游罪行。依据：参考卷 D17、E10；第455章第25A条；MSO/14 举报可疑交易讲座。"},
      {"id":29,"module":6,"variant":"official-long","stem":"报告主任收到内部披露后，柜员发邮件询问是否可直接告诉客户案件处理结果。该公司也打算只保留对外报告，不保存内部评估。以下哪些安排正确？","items":["保留内部评估或披露记录","允许柜员对追问客户确认已作出报告","让内部报告不经无故延误送达负责人","避免透露可能损害调查的信息"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，内部判断也是需要追溯的过程。②错误，客户询问不是泄露的理由。③正确，报告流程应及时。④正确，保密义务关系调查能否顺利进行。依据：参考卷 D25、D28、E23；MSO/14 举报可疑交易讲座。"},
      {"id":30,"module":6,"variant":"official-long","stem":"一笔非经常电传转账为7,900港元，款项来自汇款人在汇款机构开立的账户，且未识别到关连交易。以下哪些是应注意的事项？","items":["题述付款来源账户号码","较低金额不免除适用的汇款资料要求","汇款人姓名或名称","收款人姓名或名称"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，已有账户时须处理其号码。②正确，资料要求与金额触发的审查是两件事。③正确，汇款人资料属于随附规定范围。④正确，收款人姓名是相关信息。依据：参考卷 D33、E29、E30；第615章附表2电传转账规定。"},
      {"id":31,"module":7,"variant":"official-long","stem":"分店关闭后，档案员拟接收其客户识别文件，有些是纸质正本、有些是微缩副本，另一些已完整保存于可检索的数据库。以下哪些方式可以使用？","items":["只保存存放地点及档案编号","保存纸质正本","保存微缩影片副本","保存电脑数据库中的副本"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，索引不等于文件副本。②正确，正本属于允许的形式。③正确，微缩影片可备存副本。④正确，数据库可保存副本。依据：参考卷 D6、E8；第615章附表2备存记录规定。"},
      {"id":32,"module":7,"variant":"official-long","stem":"审查人员备存了初始身份核实文件，后续取得交易解释及相关证明，并对客户异常活动形成分析。以下哪些做法正确？","items":["留存初始身份核实资料的正本或副本","只保存开户日期即可替代后续文件","备存持续监察取得的相关记录","备存已进行的分析结果"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，初始核实有明确的留档意义。②错误，开户日期无法证明监察过程。③正确，资料更新是记录范围的一部分。④正确，分析结果说明判断依据。依据：参考卷 D10、E21；第615章附表2第20条。"},
      {"id":33,"module":7,"variant":"official-long","stem":"一名经营者在半年内暂停多数服务，账户系统显示没有交易。经理已填写内部表格并打算等关长主动追问再递交。以下哪些陈述正确？","items":["应按关长指明的方式及时递交","未按规定递交可能引致牌照监管后果","零交易自动免除当期申报","应按关长指明的格式办理"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，有适用程序及时间要求。②正确，未遵守可影响牌照。③错误，没有交易不能自行假定获豁免。④正确，内部表格不能代替指定格式。依据：参考卷 D18、D20；MSO/9 定期申报通函。"},
      {"id":34,"module":7,"variant":"official-long","stem":"合规视察时，前台能展示牌照，但其等候审批清单和监管要求备存的交易资料保存在总部。持牌人以文件不在场为由，认为没有后续配合义务。以下哪些陈述正确？","items":["资料保存在总部仍须安排按规定供查阅","例行视察可涉及进入业务处所","可涉及查阅及复制须备存的交易记录","持牌人仅展示牌照即可拒绝所有其他要求"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，储存位置不是自动豁免理由。②正确，第9条涵盖例行视察权力。③正确，备存记录可能属于视察对象。④错误，展示牌照不能取代配合视察。依据：第615章第9条；MSO/15 合规职能及法定责任讲座。"},
      {"id":35,"module":7,"variant":"official-long","stem":"检查发现同一类交易审查缺失在三个不同月份出现，部分新员工未受训且已有客户受影响。以下哪些可作为追查及整改的要点？","items":["查清发生次数和持续期间","评估问题的性质及影响","针对实际缺口安排培训及制度整改","记录已落实措施并由适当人员复核"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，持续及反复发生关系问题严重程度。②正确，影响有助评估监管后果。③正确，整改应对应实际原因。④正确，记录及复核用于证明确有落实。依据：参考卷 D22、E18；MSO/4 纪律行动指引；MSO/15 合规职能及法定责任讲座。"}

      {"id":1,"module":1,"variant":"official-long","stem":"集团收到一家海外子公司的事故通报，款项已经转换成另一种资产。法务人员要求根据相关行为若在香港发生的法律性质，以及财产与原收益的关系，判断哪些说法成立。","items":["境外发生的行为永远不在定义考虑范围","代表原收益的部分价值可以纳入分析","后来取得的资产可间接代表原收益","境外行为若在香港发生即属可公诉罪行，其收益可能相关"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，境外地点本身不会排除分析。②正确，定义包括部分代表。③正确，资产转换并不会当然切断关联。④正确，须按香港法作假设比较。依据：参考卷 D1、E1；第615章附表1第1部第1条。"},
      {"id":2,"module":1,"variant":"official-long","stem":"培训师给出两组材料，一组描述通过合法经营获得的资金，另一组描述资金拟用于某项恐怖主义行为。员工就资金用途、范围及筹集对象提出以下说法，哪些正确？","items":["只有在两个恐怖组织之间转移资金才可能涉及筹集","为恐怖分子利益募集财产也可能属于相关情形","款项来自合法经营也须考虑拟定用途","拟用于相关行为的财产可以只占所筹款项的一部分"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，适用范围不限于特定双方之间。②正确，应结合对相关身份的认识等法定条件。③正确，来源合法与用途合法是两个问题。④正确，意图可指向全部或部分财产。依据：参考卷 D2、E2；第615章附表1第1部第1条。"},
      {"id":3,"module":1,"variant":"official-long","stem":"一笔付款涉及已受指认的实体。业务经理认为客户名称本身没有上榜便无需继续核对，并把公司内部风险评级当作有关限制的依据。以下哪些判断正确？","items":["如涉及特许权，应查明其适用范围","只要直接客户未被指认，其他相关各方一概无需核对","应查明适用制裁规定及指认对象","相关规定可涉及直接或间接提供资金或经济资源"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，不能把有限特许当作一般豁免。②错误，义务可能涉及客户以外的相关方。③正确，法定限制须按适用规定判断。④正确，间接提供也可能受限。依据：参考卷 D4、E3；MSO/3 金融制裁及筛查章节。"},
      {"id":4,"module":1,"variant":"official-long","stem":"一家境外投资方准备参与MSO业务，表示某国际标准组织的良好评核可以同时代替香港发牌和业务合规检查。以下哪些陈述正确？","items":["国际标准制作及促进实施属于财务行动特别组织的工作","评核用于检视司法管辖区的实施情况","在香港经营受发牌规管的服务仍须依香港发牌制度办理","国际评核通过等同为个别经营者签发本地牌照"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，标准面向整体制度及实施。②正确，评核对象及目的与个别发牌不同。③正确，发牌责任须依据第615章等适用规定。④错误，该评核不能授予本地牌照。依据：参考卷 D3、D5、E4；第615章第5部。"},
      {"id":5,"module":1,"variant":"official-long","stem":"某经营者拟保留原有柜台业务，并增加由合作方提供的线上渠道。其客户来自多个地区，部分付款将由新的交易对手处理。风险评估工作应包括哪些内容？","items":["评估合作方及交易对手网络","根据结果调整风险缓解措施","厘清新增渠道提供的服务及其范围","分析客群及其所在司法管辖区"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，合作网络可能改变交易风险。②正确，识别因素后还需要落实应对。③正确，服务设计影响风险暴露。④正确，客户与地域是评估维度。依据：参考卷 E6、E17；MSO/13 风险评估及缓解讲座。"},
      {"id":6,"module":2,"variant":"official-long","stem":"公司打算一边继续在原址经营，一边在新商场短期开设柜台办理兑换。负责人把临时柜台视为宣传活动，但柜台将实际接受交易。以下哪些陈述正确？","items":["获准后须按适用要求展示牌照","应按柜台的实际经营活动判断监管要求","涉及新增指明处所时应先申请批准","只要在租约上写明临时，便可不受新增处所规定约束"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，展示仍是持牌责任。②正确，是否实际提供服务是关键事实。③正确，手续须在经营前办妥。④错误，租赁期限不能代替批准。依据：参考卷 D9、D20、E9；第615章第5部；MSO/11 发牌规定。"},
      {"id":7,"module":2,"variant":"official-long","stem":"持牌人的续牌资料显示，一名相关人员曾受专业团体纪律处分，但并未被刑事定罪，另有一名法团申请人正在清盘。以下哪些陈述正确？","items":["不存在刑事定罪时，专业纪律记录不得被考虑","专业团体的纪律处分可纳入审查","法团清盘情况是可考虑因素","有关刑事或纪律程序也可作为评估资料"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，专业纪律与刑事定罪属于不同因素。②正确，纪律纪录反映适当性相关情况。③正确，清盘关系法团状况。④正确，应结合具体资料作整体判断。依据：参考卷 D14、E7；MSO/6 适当人选准则。"},
      {"id":8,"module":2,"variant":"official-long","stem":"某持牌人正更新牌照档案，涉及本地账目储存地址、洗钱报告主任和位于混合式商住楼宇内指明处所的占用人。哪些变化属于资料所列的具报项目？","items":["洗钱报告主任","题述混合式商住楼宇内指明处所的占用人","每一名普通柜员的个人电话","本地账目及记录储存地址"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，洗钱报告主任是指定岗位。②正确，应核对有关处所和占用人资料。③错误，参考卷列明的事项不包括所有柜员的个人电话。④正确，储存地点是特定资料项目。依据：参考卷 D19、E11；MSO/11 发牌规定。"},
      {"id":9,"module":2,"variant":"official-long","stem":"一名独资持牌人决定停止经营，原本打算把牌照正本留在柜台供旧客户查阅，也未准备明确停业日期。以下哪些安排正确？","items":["按适用规定交回牌照","在书面通知中列明停业意向","如果没有新客户便可无限期延后办理手续","在书面通知中列明停业日期"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，保留原件给客户看不能取代交回。②正确，意向属书面具报内容。③错误，停止接单不改变办理责任。④正确，关长需要明确的停业日期。依据：参考卷 D8、E14；第615章第5部；MSO/11 发牌规定。"},
      {"id":10,"module":2,"variant":"official-long","stem":"受聘经理准备为新上任的董事制作持续合规清单，覆盖指定人员、申报及分店要求。以下哪些事项可纳入清单？","items":["委任合规主任和洗钱报告主任","遵守关长施加的牌照条件","按规定递交定期申报","在指明处所显眼位置展示牌照正本"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，两个岗位承担不同职责。②正确，牌照条件在经营中持续适用。③正确，申报属于持续责任。④正确，展示须符合位置及文件形式要求。依据：参考卷 D19、D20、E28；MSO/11 发牌规定。"},
      {"id":11,"module":3,"variant":"official-long","stem":"两笔相隔数天的非经常电传转账金额各为4,000港元，使用不同的渠道，但客户提交的证明显示两笔款项用于同一份合同。以下哪些陈述正确？","items":["使用不同渠道便必须认定无关连","若认定有关连，合计恰为8,000港元达到电传转账门槛","独立的洗钱怀疑也可触发审查","时间间隔和共同目的均可纳入关连判断"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，渠道差异只是一个事实。②正确，金额门槛包含等于。③正确，可疑情况不依赖金额条件。④正确，关连判断须结合两个维度。依据：参考卷 E24、E29；第615章附表2第3条。"},

      {"id":13,"module":3,"variant":"official-long","stem":"甲透过信托控制法团26%的已发行股本，乙控制其成员大会30%的投票权，丙行使管理上的最终控制权，丁仅在董事会决议中获委任联络银行。以下哪些陈述正确？","items":["丁因获委任为联络人便自动符合定义","甲可因间接股本控制超过25%而符合定义","乙可因投票权超过25%而符合定义","丙可因最终控制管理而符合定义"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，联络职务不说明最终拥有或控制。②正确，经信托间接控制也须考虑。③正确，投票权独立于股本标准。④正确，最终管理控制是独立条件。依据：参考卷 D11、E12；第615章附表2第1条。"},
      {"id":14,"module":3,"variant":"official-long","stem":"某客户的代理人只出示由一家与交易有关的公司自行打印的身份表，另提供一份未签署的授权书。审核员正在建立可靠来源及授权的核对流程。以下哪些安排正确？","items":["在适当情况下采用政府机构资料核实身份","就代理权另作合理核实","只要代理人自己填表就可完成全部核实","评估身份资料来源的可靠性和独立性"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，政府机构是资料所列来源之一。②正确，未签署文件不能自动证明授权。③错误，自填资料无法独立证明本人及权限。④正确，非独立资料不能不经判断即采纳。依据：参考卷 D16、E35；第615章附表2第2条。"},
      {"id":15,"module":3,"variant":"official-long","stem":"经营者从原有合资格中介转至另一服务商，并要求新旧中介的安排都支持日后抽查。关于尽职审查资料的取得及责任，下列哪些陈述正确？","items":["有关文件在提出请求后应尽快提供","应安排旧中介在服务结束后交回有关文件和记录","应确认履行规定的最终责任仍在经营者","需要有可取得相关资料的系统"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，只有合同约定而不能及时取用并不足够。②正确，交接有助避免记录在退出时失去。③正确，依赖安排不移转责任。④正确，系统必须支持实际查阅。依据：参考卷 D12、E33；第615章附表2第18条。"},
      {"id":16,"module":4,"variant":"official-long","stem":"合规部测试自然人开户表单，发现系统把职业设为必填，却没有录入全名、国籍和证件类别的完整字段。以下哪些应作为基本识别资料考虑？","items":["独特证件号码及证件类别","全名","国籍","可用职业替代全名及国籍"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，号码和类别需要配合。②正确，全名是自然人基础识别字段。③正确，国籍在资料列举范围内。④错误，职业的用途不能取代身份字段。依据：参考卷 D21、D35、E26；MSO/3 客户尽职审查章节。"},
      {"id":17,"module":4,"variant":"official-long","stem":"客户属于多层信托安排。初步档案只有一个中间法团的名称，而受托人另委派代表完成交易手续。以下哪些处理正确？","items":["应按实际安排确认受托人的客户身份","符合代理人定义者须按规定识别和核实","应关注谁最终拥有、控制或主导管理","只需取得中间法团名称即可结束最终控制分析"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，受托人代表信托交易时可作为客户。②正确，代理职责产生相应识别核实要求。③正确，分析重点是最终控制关系。④错误，中间层不能说明最终控制。依据：参考卷 E32；MSO/3 客户尽职审查章节。"},
      {"id":18,"module":4,"variant":"official-long","stem":"正式开户前，审查人员确认法团客户一名实益拥有人为外地政治人物。业务部门准备由当值柜长批准，并在三个月后抽查。以下哪些安排正确？","items":["把更严格的持续监察纳入计划","由柜长批准再抽查即可代替适用的高级管理层批准","按规定在建立关系前取得高级管理层批准","采取合理措施确立相应的财富来源和资金来源"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，政治人物风险需要相称的后续监察。②错误，事后抽查无法代替事前批准。③正确，批准必须由相应层级作出。④正确，两类来源应分别关注。依据：参考卷 D13、E16；MSO/3 加强尽职审查章节。"},
      {"id":19,"module":4,"variant":"official-long","stem":"团队建立客户风险清单，正在比较公营机构、受披露规定约束的上市法团、获授权公售的集体投资计划，以及来自海外的个人客户。以下哪些说法正确？","items":["获授权公开发售的集体投资计划可属于潜在较低风险因素","香港公共机构可属于潜在较低风险因素","只要是外国公民便必须视作较低风险","受有关披露要求约束的上市法团可属于潜在较低风险因素"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，须确认其公售授权。②正确，公营机构是题库列出的例子。③错误，国籍本身不能支持这一结论。④正确，披露规定是判断因素之一。依据：参考卷 D27、E34；MSO/3 风险为本方法章节。"},
      {"id":20,"module":4,"variant":"official-long","stem":"一家新客户经营现金密集业务，并以多层公司支撑一个尚未解释的商业安排。合规人员希望在风险评级中区分客观特征、客户解释和应采取的措施。以下哪些做法正确？","items":["评估现金密集性质和安排的具体目的","查明复杂结构可能造成的透明度问题","结合多个因素而非单一资料制定评级","为相称的缓解措施及判断保留理据"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，业务和结构都可能影响暴露。②正确，复杂结构可影响最终控制识别。③正确，不同因素可能相互加强或缓和。④正确，理由及措施应可复核。依据：参考卷 D26、D29、E31；MSO/13 风险评估及缓解讲座。"},
      {"id":21,"module":5,"variant":"official-long","stem":"管理层任命两名主任后，仅让他们查看经过业务部门筛选的月度统计，且没有提供任何重大事件的升级通道。以下哪些判断正确？","items":["应能及时取得履职所需资料","高级管理层应监督管控制度的有效运作","职位名称足以证明人员能履职","应具备适当资历及权力"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，事后汇总未必足以处理即时风险。②正确，管治责任不因任命而转移。③错误，履职还需要人员、权限和资料条件。④正确，相称资历及权限支持决策。依据：参考卷 D22、E22；MSO/15 合规职能及法定责任讲座。"},
      {"id":22,"module":5,"variant":"official-long","stem":"审核负责人发现交易量上升后，原先采用的手工抽样无法覆盖多渠道业务。机构正在决定独立审核应检查哪些内容，以及监察系统应怎样调整。","items":["系统一旦使用就不应再按业务变化调整","审核应检视制度和合规职能是否有效","应根据规模及复杂程度设计系统","应根据服务特征及其风险调整管控"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，系统应适应业务与风险的变化。②正确，有效性需要实质审查。③正确，规模和复杂程度影响监察需求。④正确，不同服务风险不同。依据：参考卷 D22、D32、E19；MSO/3 机构管治及持续监察章节。"},
      {"id":23,"module":5,"variant":"official-long","stem":"前线和风险组都发现个案，但公司没有统一的内部报告收件人。管理层拟安排报告主任负责联系财富情报组，并厘清报告记录由谁保管。以下哪些安排正确？","items":["把可疑交易报告中央联络职责交给洗钱报告主任","每个业务组可因客户重要而隐去内部披露","由洗钱报告主任审核内部披露及决定是否对外报告","保存内部审查的有关记录"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，统一联络点支持及时处理。②错误，客户的重要程度不能成为拦截披露的依据。③正确，决定应依据掌握的相关资料。④正确，记录用于追踪处理过程。依据：参考卷 D23、D25、E23；MSO/14 举报可疑交易讲座。"},
      {"id":24,"module":5,"variant":"official-long","stem":"持牌人招聘了兼职柜员及新监察人员，准备按岗位分别安排培训，并建立可供监管抽查的记录。以下哪些陈述正确？","items":["应安排复修以应对风险和规定变化","只保留培训费用发票即可证明人员已受训","应记录受训人员、培训时间和类别","应为相关人员提供充分培训"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，复修能更新对职责和风险的认识。②错误，费用发票不显示人员完成情况。③正确，记录应能具体证明培训覆盖。④正确，人员承担相关职责即需适当培训。依据：参考卷 D31、E18；MSO/7 持续专业培训指引。"},
      {"id":25,"module":5,"variant":"official-long","stem":"独立审查发现多笔交易的审核责任无人认领，员工也无法识别应交由管理层决定的个案。整改委员会拟逐项改善授权、资源及监督。以下哪些安排正确？","items":["在整改后检查制度是否有效","明确前线、合规和管理层的职责","确保负责人员有相称权限","为风险较高的领域配置相称资源"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，复查可判断措施是否落地。②正确，职责明确有助避免漏审。③正确，无权限会妨碍履职。④正确，分配应反映风险水平。依据：参考卷 D22、D23、E22；MSO/15 合规职能及法定责任讲座。"},
      {"id":26,"module":6,"variant":"official-long","stem":"名单系统收到更新并匹配到一个客户，但同名记录的出生资料和身份信息仍待核实。该客户使用的另一家法团也有待检查其控制者。以下哪些做法正确？","items":["一经同名便可省去核查并直接认定真实命中","按照最新指认尽快筛查客户及相关实益拥有人","以额外识别资料区分同名和实际命中","在建立业务关系时用当时的数据库进行筛查"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，姓名匹配只是起点。②正确，更新筛查应覆盖相关人士。③正确，核查须考虑可取得的辨别资料。④正确，开户筛查及更新筛查都是防线。依据：参考卷 D4、D24；MSO/3 筛查章节。"},
      {"id":27,"module":6,"variant":"official-long","stem":"一间客户的新交易总数与平时相若，但多笔收款发生在新的地点，交易类型也改为客户过去没有使用的类别。下列哪些资料适合用于监察判断？","items":["收付款地点及交易对手","实际交易性质和类别","只须参考员工个人对客户的熟悉程度","客户通常营业额及账户活动"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，地点与对手影响风险判断。②正确，交易类型变化可能是重要偏离。③错误，个人熟悉程度无法代替事实分析。④正确，既有活动提供可比较的基准。依据：参考卷 D30、D32；MSO/3 持续监察章节。"},
      {"id":28,"module":6,"variant":"official-long","stem":"公司尚未执行一项指示，员工在内部审查中发现资料矛盾。报告主任仅能判断款项涉嫌代表犯罪得益，不能判断是何种可公诉罪行。以下哪些陈述正确？","items":["确立相关怀疑后应在切实可行范围内尽快报告","报告判断不以证实犯罪为前提","未执行指示也应考虑适用报告责任","未查明具体上游罪行便必须暂缓一切报告"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，报告应及时作出。②正确，适用门槛是知悉或怀疑。③正确，报告责任并不以完成付款为前提。④错误，可在未确定具体罪行时形成怀疑。依据：参考卷 D17、E10；第455章第25A条；MSO/14 举报可疑交易讲座。"},
      {"id":29,"module":6,"variant":"official-long","stem":"客户服务人员收到追问，希望把案件已交报告主任的情况告诉客户。机构还要决定保存哪些内部记录以及报告何时送达。下列哪些安排正确？","items":["限制可能损害调查的信息外泄","使内部报告无故延误的情况得到纠正","只留最终对外报告，内部审查和披露一律销毁","保存内部披露和相关审查记录"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，防止通风报讯是内部管控责任。②正确，送达负责人不应无故延误。③错误，内部处理过程亦有留档价值。④正确，记录支持复核和追踪。依据：参考卷 D25、D28、E23；第455章第25A条；MSO/14 举报可疑交易讲座。"},
      {"id":30,"module":6,"variant":"official-long","stem":"一位客户通过代表提交一笔9,500港元的汇款指示，题设明确该项交易并非电传转账。汇款人使用旅行证件。根据资料，以下哪些事项须处理？","items":["记录接获指示的日期及时间","处理代表客户行事者的识别及核实","记录旅行证件签发地方","记录收款人地址"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，记录接获指示时间有助还原交易。②正确，代表人不能由汇款人资料代替。③正确，签发地方用于明确证件资料。④正确，收款人地址属于题库所列资料。依据：参考卷 D34、E25；MSO/3 非电传汇款章节。"},
      {"id":31,"module":7,"variant":"official-long","stem":"总部比较三种档案系统，分别存放纸质正本、微缩副本及电子副本。有人建议在搬迁时把文件全部去掉，只保留案件目录。哪些安排可作为备存文件形式？","items":["以微缩影片保存文件副本","以电脑数据库保存文件副本","保存纸质文件正本","只保存案件目录和存档地名"],"answer":0,"tip":"正确答案：A（1、2、3）。①正确，微缩形式可保留副本。②正确，电子资料库同样可保存副本。③正确，正本可以满足形式要求。④错误，目录只能定位文件，不能代替它。依据：参考卷 D6、E8；第615章附表2备存记录规定。"},
      {"id":32,"module":7,"variant":"official-long","stem":"受审客户最初提供身份证明，其后在监察期间提交资金解释及业务文件，审核人员据此得出不进一步升级的分析结论。哪些资料应备存？","items":["已经作出的分析结果","仅备存口头交接名单即可替代其他资料","识别及核实过程中取得的文件正本或副本","持续监察期间取得的有关记录"],"answer":1,"tip":"正确答案：B（1、3、4）。①正确，未升级也可能需要说明分析理据。②错误，交接名单不足以还原审查。③正确，初始核实文件属于所列记录。④正确，后续证明反映监察过程。依据：参考卷 D10、E21；第615章附表2第20条。"},
      {"id":33,"module":7,"variant":"official-long","stem":"一家季节性经营的持牌人在某一申报期内没有业务。助手建议把该期和下期合并，并采用自己制作的表格递交。以下哪些陈述正确？","items":["应按关长指明格式递交","应按适用期限及指定方式办理","可以自行以内部表格决定合并申报期","零交易不能自行推定为免报"],"answer":3,"tip":"正确答案：D（1、2、4）。①正确，申报应依指定格式。②正确，时限与方式都是程序要求。③错误，内部决定不能变更监管申报安排。④正确，有无交易不自动改变责任。依据：参考卷 D18、D20、E28；MSO/9 定期申报通函。"},
      {"id":34,"module":7,"variant":"official-long","stem":"负责合规视察的人员要求查阅指明的客户及交易记录。持牌人准备安排总部提供电子副本，但某经理称视察只能查看店内陈列的纸质文件。哪些陈述正确？","items":["所有未放在店内的资料都自动超出视察范围","应合理安排按规定取得和提供相关记录","例行合规视察可以涉及进入业务处所","可涉及查阅及复制规定须备存的资料"],"answer":2,"tip":"正确答案：C（2、3、4）。①错误，储存地点不会自动改变资料范围。②正确，记录应实际可取。③正确，第9条涉及该项视察权力。④正确，规定记录可成为查阅或复制对象。依据：第615章第9条；MSO/15 合规职能及法定责任讲座。"},
      {"id":35,"module":7,"variant":"official-long","stem":"合规检查发现一间分店数次未按规定记录风险评估，也遗漏了部分培训。管理层要判断影响并建立跟进证据。哪些步骤适当？","items":["留存整改及复核结果","明确缺失的性质和涉及范围","核对重复次数和持续情况","补足相关培训并修正操作程序"],"answer":4,"tip":"正确答案：E（1、2、3、4）。①正确，留档可供后续检查及确认效果。②正确，性质及范围帮助判断影响。③正确，频次和时长与严重性有关。④正确，针对成因方能纠正控制缺口。依据：参考卷 D22、D31、E18；MSO/4 纪律行动指引；MSO/15 合规职能及法定责任讲座。"}
    ];

    // Use a fresh sync ID so old question numbers cannot restore onto the new paper.
    const FIRST_PAPER_ID = 14;
    const PAPERS = {
      [FIRST_PAPER_ID]: { name: "1", storage: "mso_exam_cn_series2_paper1", questions: PAPER1 },
      15: { name: "2", storage: "mso_exam_cn_series2_paper2", questions: PAPER2 },
      16: { name: "3", storage: "mso_exam_cn_series2_paper3", questions: PAPER3 },
    };

    const savedPaperId = Number(localStorage.getItem("mso_exam_active_paper"));
    let paperId = Object.hasOwn(PAPERS, savedPaperId) ? savedPaperId : FIRST_PAPER_ID;

    function questions() { return PAPERS[paperId].questions; }
    function storageKey() { return PAPERS[paperId].storage; }

    function defaultState() {
      return {
        answers: Object.fromEntries(questions().map(q => [String(q.id), null])),
        submitted: false,
        showTips: false,
        onlyWrong: false,
        onlyBlank: false,
        filter: 0,
        wrongBook: [],
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(storageKey());
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return {
          answers: { ...Object.fromEntries(questions().map(q => [String(q.id), null])), ...(parsed.answers || {}) },
          submitted: !!parsed.submitted,
          showTips: !!parsed.showTips,
          onlyWrong: !!parsed.onlyWrong,
          onlyBlank: !!parsed.onlyBlank,
          filter: parsed.filter || 0,
          wrongBook: Array.isArray(parsed.wrongBook) ? parsed.wrongBook : [],
        };
      } catch {
        return defaultState();
      }
    }

    let state = loadState();

    function saveState(showToast = true) {
      localStorage.setItem(storageKey(), JSON.stringify(state));
      localStorage.setItem("mso_exam_active_paper", String(paperId));
      if (window.QsortCloud) window.QsortCloud.queueSave(paperId, state);
      if (showToast) {
        const t = document.getElementById("toast");
        t.classList.add("show");
        clearTimeout(window.__toastTimer);
        window.__toastTimer = setTimeout(() => t.classList.remove("show"), 900);
      }
      updateHeader();
    }

    function choicesOf(q) {
      return q.variant === "stages" ? STAGES : (q.variant === "official-long" ? LONG_STD : STD);
    }

    function answeredCount() {
      return questions().filter(q => state.answers[String(q.id)] != null).length;
    }

    function moduleStats() {
      return [1,2,3,4,5,6,7].map(mod => {
        const qs = questions().filter(q => q.module === mod);
        const wrong = qs.filter(q => state.answers[String(q.id)] != null && state.answers[String(q.id)] !== q.answer).length;
        const correct = qs.filter(q => state.answers[String(q.id)] === q.answer).length;
        const blank = qs.filter(q => state.answers[String(q.id)] == null).length;
        return { mod, wrong, correct, blank, ok: wrong <= 2 && blank === 0 };
      });
    }

    function updateHeader() {
      document.getElementById("title").textContent = `MSO 能力评核 · ${PAPERS[paperId].name}`;
      document.getElementById("subtitle").textContent =
        "35题 · 7个单元 · 组合选择题 · 自动保存，登录后跨设备同步";

      const n = answeredCount();
      document.getElementById("sAnswered").textContent = `${n}/35`;
      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.disabled = n < 35 || state.submitted;
      document.getElementById("btnTips").hidden = !state.submitted;
      document.getElementById("btnWrong").hidden = !state.submitted;
      document.getElementById("btnContinue").hidden = state.submitted;
      document.getElementById("btnTips").textContent = state.showTips ? "隐藏解析" : "显示解析";
      document.getElementById("btnWrong").textContent = state.onlyWrong ? "显示全部题" : "只看错题";
      document.getElementById("btnWrongBook").textContent = "错题本（" + getAllWrongBook().length + "）";
      document.getElementById("btnWrongBook").classList.toggle("primary", wrongBookView);
      document.getElementById("btnContinue").textContent = state.onlyBlank ? "显示全部题" : "只看未答题";

      if (!state.submitted) {
        document.getElementById("sScore").textContent = "—";
        document.getElementById("sModules").textContent = "—";
        document.getElementById("sResult").textContent = n ? "续做中" : "作答中";
        document.getElementById("resultBox").hidden = true;
        document.getElementById("saveNote").textContent =
          n > 0
            ? `${PAPERS[paperId].name} 已自动保存 ${n}/35。关掉再打开可继续。`
            : `当前是${PAPERS[paperId].name}。进度保存在本机浏览器；各套试卷互不影响。`;
        return;
      }

      const total = questions().filter(q => state.answers[String(q.id)] === q.answer).length;
      const mods = moduleStats();
      const modulePass = mods.every(m => m.ok);
      const pass = total >= 25 && modulePass;
      document.getElementById("sScore").textContent = String(total);
      document.getElementById("sModules").textContent = modulePass ? "达标" : "未达标";
      document.getElementById("sResult").textContent = pass ? "合格" : "不合格";
      const box = document.getElementById("resultBox");
      box.hidden = false;
      box.innerHTML =
        `<b>${PAPERS[paperId].name} · 分单元成绩</b><br>` +
        mods.map(m =>
          `单元${m.mod}：对 ${m.correct}／错 ${m.wrong}` +
          (m.wrong > 2 ? `　← 本单元不及格` : "")
        ).join("<br>") +
        `<br><br><b>总评：${pass ? "合格" : "不合格"}</b>（须总分≥25，且每单元最多错2题）`;
    }

    function renderPaperTabs() {
      const el = document.getElementById("paperTabs");
      el.innerHTML = "";
      Array.from({ length: 20 }, (_, i) => i + 1).forEach(id => {
        if (!PAPERS[id]) return;
        const b = document.createElement("button");
        b.className = "chip" + (paperId === id ? " on" : "");
        b.textContent = PAPERS[id].name;
        b.onclick = () => {
          paperId = id;
          state = loadState();
          saveState(false);
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        el.appendChild(b);
      });
    }

    function renderFilters() {
      const el = document.getElementById("filters");
      el.innerHTML = "";
      const all = document.createElement("button");
      all.textContent = "全部单元";
      all.className = "chip" + (state.filter === 0 ? " on" : "");
      all.onclick = () => { state.filter = 0; saveState(false); render(); };
      el.appendChild(all);
      for (let m = 1; m <= 7; m++) {
        const b = document.createElement("button");
        b.textContent = `单元${m}`;
        b.className = "chip" + (state.filter === m ? " on" : "");
        b.onclick = () => { state.filter = m; saveState(false); render(); };
        el.appendChild(b);
      }
    }


    let wrongBookView = false;
    function getAllWrongBook() {
      const all = [];
      Array.from({ length: 20 }, (_, i) => i + 1).forEach(id => {
        if (!PAPERS[id]) return;
        try {
          const raw = localStorage.getItem(PAPERS[id].storage), saved = raw ? JSON.parse(raw) : null;
          (saved && Array.isArray(saved.wrongBook) ? saved.wrongBook : []).forEach(item => all.push(item));
        } catch {}
      });
      return all.sort((a,b) => String(b.addedAt || "").localeCompare(String(a.addedAt || "")));
    }
    function savePaperWrongBook(id, paperState) {
      localStorage.setItem(PAPERS[id].storage, JSON.stringify(paperState));
      if (window.QsortCloud) window.QsortCloud.queueSave(id, paperState);
      if (id === paperId) state = paperState;
    }
    function addWrongBookFromSubmission() {
      if (!Array.isArray(state.wrongBook)) state.wrongBook = [];
      questions().forEach(q => {
        const chosen = state.answers[String(q.id)];
        if (chosen == null || chosen === q.answer) return;
        const existing = state.wrongBook.find(item => item.questionId === q.id && item.paperId === paperId);
        if (existing) { existing.selectedAnswer = chosen; existing.attempts = Number(existing.attempts || 1) + 1; }
        else state.wrongBook.push({paperId:paperId,questionId:q.id,selectedAnswer:chosen,addedAt:new Date().toISOString(),attempts:1});
      });
    }
    function renderWrongBook() {
      const host = document.getElementById("paper"); host.innerHTML = "";
      const items = getAllWrongBook();
      const heading = document.createElement("h2"); heading.className = "mod-title";
      heading.textContent = "我的错题本 · " + items.length + " 题"; host.appendChild(heading);
      const intro = document.createElement("div"); intro.className = "note";
      intro.textContent = "交卷后答错的题目会自动收录。重新作答正确后，该题会自动从错题本移除；错题本会随登录账号同步。"; host.appendChild(intro);
      if (!items.length) { const empty=document.createElement("div"); empty.className="note ok"; empty.textContent="目前没有错题，继续保持！"; host.appendChild(empty); return; }
      items.forEach(item => {
        const source=PAPERS[item.paperId], q=source && source.questions.find(question=>question.id===item.questionId); if(!q)return;
        const card=document.createElement("section"); card.className="wrongbook-card";
        const meta=document.createElement("div"); meta.className="wrongbook-meta";
        meta.textContent=source.name+" · 第"+q.id+"题 · 单元"+q.module+" · 已练习"+(item.attempts||1)+"次"; card.appendChild(meta);
        const title=document.createElement("div"), strong=document.createElement("b"); strong.textContent=q.stem; title.appendChild(strong); card.appendChild(title);
        q.items.forEach((text,index)=>{const line=document.createElement("div");line.className="items";line.textContent=(index+1)+". "+text;card.appendChild(line);});
        choicesOf(q).forEach((label,index)=>{
          const choice=document.createElement("button");choice.type="button";choice.className="choice";choice.textContent=label;
          if(item.selectedAnswer===index)choice.classList.add("wrong");
          choice.onclick=()=>{
            const raw=localStorage.getItem(source.storage),saved=raw?JSON.parse(raw):{},list=Array.isArray(saved.wrongBook)?saved.wrongBook:[];
            const target=list.find(entry=>entry.paperId===item.paperId&&entry.questionId===item.questionId);if(!target)return;
            if(index===q.answer){saved.wrongBook=list.filter(entry=>!(entry.paperId===item.paperId&&entry.questionId===item.questionId));savePaperWrongBook(item.paperId,saved);showToastMessage("答对了，已从错题本移除");}
            else{target.selectedAnswer=index;target.attempts=Number(target.attempts||1)+1;target.lastAttemptAt=new Date().toISOString();savePaperWrongBook(item.paperId,saved);showToastMessage("再想一想，答案还不正确");}
            render();
          };card.appendChild(choice);
        });
        const answer=document.createElement("div");answer.className="wrongbook-answer";
        answer.textContent="正确答案："+choicesOf(q)[q.answer]+"　解析："+(q.tip||"暂无解析");card.appendChild(answer);
        const remove=document.createElement("button");remove.type="button";remove.textContent="从错题本移除";remove.style.marginTop="10px";
        remove.onclick=()=>{const raw=localStorage.getItem(source.storage),saved=raw?JSON.parse(raw):{};saved.wrongBook=(Array.isArray(saved.wrongBook)?saved.wrongBook:[]).filter(entry=>!(entry.paperId===item.paperId&&entry.questionId===item.questionId));savePaperWrongBook(item.paperId,saved);render();};
        card.appendChild(remove);host.appendChild(card);
      });
    }
    function showToastMessage(message) {
      const toast=document.getElementById("toast");toast.textContent=message;toast.classList.add("show");
      clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>toast.classList.remove("show"),1400);
    }

    function visibleQuestions() {
      let list = state.filter === 0 ? questions() : questions().filter(q => q.module === state.filter);
      if (state.submitted && state.onlyWrong) list = list.filter(q => state.answers[String(q.id)] !== q.answer);
      if (!state.submitted && state.onlyBlank) list = list.filter(q => state.answers[String(q.id)] == null);
      return list;
    }

    function render() {
      renderPaperTabs();
      renderFilters();
      updateHeader();
      const paper = document.getElementById("paper");
      if (wrongBookView) { renderWrongBook(); return; }
      paper.innerHTML = "";
      const list = visibleQuestions();
      let lastMod = null;
      list.forEach(q => {
        if (q.module !== lastMod) {
          lastMod = q.module;
          const h = document.createElement("div");
          h.className = "mod-title";
          h.textContent = MODULES[q.module - 1];
          paper.appendChild(h);
        }
        const selected = state.answers[String(q.id)];
        const card = document.createElement("div");
        card.className = "q";
        const head = document.createElement("div");
        head.className = "q-head";
        const title = document.createElement("div");
        title.innerHTML = `<b>${q.id}. ${q.stem}</b>`;
        const pill = document.createElement("span");
        pill.className = "pill";
        if (state.submitted && selected != null) {
          const ok = selected === q.answer;
          pill.className = "pill " + (ok ? "ok" : "bad");
          pill.textContent = ok ? "正确" : `答案 ${KEYS[q.answer]}`;
        } else if (selected != null) {
          pill.className = "pill saved";
          pill.textContent = "已保存";
        } else {
          pill.textContent = `第${q.id}题`;
        }
        head.appendChild(title);
        head.appendChild(pill);
        card.appendChild(head);

        const items = document.createElement("div");
        items.className = "items";
        items.innerHTML = q.items.map((it, i) => `${i + 1}. ${it}`).join("<br>");
        card.appendChild(items);

        choicesOf(q).forEach((label, idx) => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.type = "button";
          btn.textContent = label;
          if (selected === idx) btn.classList.add("active");
          if (state.submitted) {
            if (idx === q.answer) btn.classList.add("correct");
            if (selected === idx && idx !== q.answer) btn.classList.add("wrong");
          } else {
            btn.onclick = () => {
              state.answers[String(q.id)] = idx;
              saveState(true);
              render();
            };
          }
          card.appendChild(btn);
        });

        if (state.submitted && state.showTips) {
          const tip = document.createElement("div");
          tip.className = "tip";
          tip.textContent = "解析：" + q.tip;
          card.appendChild(tip);
        }
        paper.appendChild(card);
      });
    }

    document.getElementById("btnWrongBook").onclick = () => { wrongBookView = !wrongBookView; render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
    document.getElementById("btnSubmit").onclick = () => {
      if (answeredCount() < 35) return;
      state.submitted = true;
      state.onlyBlank = false;
      addWrongBookFromSubmission();
      state.showTips = true;
      saveState(false);
      if (window.QsortCloud) window.QsortCloud.recordSubmission(paperId, state);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };
    document.getElementById("btnTips").onclick = () => {
      state.showTips = !state.showTips;
      saveState(false);
      render();
    };
    document.getElementById("btnWrong").onclick = () => {
      state.onlyWrong = !state.onlyWrong;
      saveState(false);
      render();
    };
    document.getElementById("btnContinue").onclick = () => {
      state.onlyBlank = !state.onlyBlank;
      saveState(false);
      render();
    };
    document.getElementById("btnReset").onclick = () => {
      if (!confirm(`确认清空「${PAPERS[paperId].name}」全部进度并重做？`)) return;
      const retainedWrongBook = Array.isArray(state.wrongBook) ? state.wrongBook : [];
      state = defaultState();
      state.wrongBook = retainedWrongBook;
      saveState(false);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    render();
    if (window.QsortCloud) window.QsortCloud.init({
      storageKey: (id) => PAPERS[id]?.storage,
      getActivePaper: () => paperId,
      questions: (id) => PAPERS[id]?.questions,
      paperName: (id) => `新版 ${PAPERS[id].name}`,
      applyState: (id, cloudState) => {
        if (PAPERS[id] && cloudState) localStorage.setItem(PAPERS[id].storage, JSON.stringify(cloudState));
        else if (PAPERS[id]) localStorage.removeItem(PAPERS[id].storage);
        if (id === paperId) { state = loadState(); render(); }
      }
    });
  </script>
</body>
</html>
